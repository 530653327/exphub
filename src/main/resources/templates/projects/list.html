<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('项目管理 - 经验阁 ExpHub')}"/>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: nav('projects')}"></div>

    <div class="main-content">
        <div class="topbar page-head">
            <div class="page-title-wrap">
                <h4 class="page-title"><i class="fas fa-folder-open"></i>项目管理</h4>
                <div class="page-sub">
                    <span th:if="${keyword != null and keyword != ''}">搜索「<strong th:text="${keyword}"></strong>」 · </span>
                    <span th:if="${keyword == null or keyword == ''}">全部项目 · </span>
                    共 <strong th:text="${totalRows}">0</strong> 个项目
                    <span th:if="${totalPages > 1}">· 第 <span th:text="${currentPage}">1</span> / <span th:text="${totalPages}">1</span> 页</span>
                </div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" data-toggle="modal" data-target="#createModal">
                    <i class="fas fa-plus mr-1"></i> 新建项目
                </button>
            </div>
        </div>

        <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- 搜索：名称 / 编码 / 别名 三列 OR 模糊匹配（服务端口径见 ProjectService.listProjects） -->
        <div class="toolbar">
            <form th:action="@{/projects}" method="get" class="input-group" style="flex:1;min-width:240px;">
                <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                       placeholder="搜索名称 / 编码 / 别名...">
                <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </form>
            <a th:if="${keyword != null and keyword != ''}" th:href="@{/projects}" class="btn btn-outline-secondary">清空</a>
        </div>

        <div class="card list-card">
            <div class="card-body p-0">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th><th>名称</th><th>编码</th><th>别名</th><th>状态</th><th>更新时间</th><th width="160">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${projects}">
                            <td th:text="${p.id}">1</td>
                            <td><a th:href="@{'/projects/' + ${p.id}}" th:text="${p.name}">项目名</a></td>
                            <td><code th:text="${p.projectCode}">code</code></td>
                            <td th:text="${p.aliases}">-</td>
                            <td><span class="badge-active" th:text="${p.status}">ACTIVE</span></td>
                            <td th:text="${p.updatedAt}">-</td>
                            <td>
                                <a th:href="@{'/projects/' + ${p.id}}" class="btn btn-sm btn-outline-primary">详情</a>
                                <form th:action="@{'/projects/' + ${p.id} + '/archive'}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">归档</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(projects)}">
                            <td colspan="7" class="empty-state">
                                <i class="fas fa-folder-open"></i>
                                <p th:if="${keyword != null and keyword != ''}">没有匹配「<span th:text="${keyword}"></span>」的项目，换个词或
                                    <a th:href="@{/projects}">清空搜索</a>
                                </p>
                                <p th:if="${keyword == null or keyword == ''}">暂无项目，点击右上角「新建项目」</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页：始终显示（一页装得下也明确写出来），否则会像「没有分页」 -->
            <div th:if="${totalRows > 0}" class="list-card-foot d-flex justify-content-between align-items-center flex-wrap" style="gap:10px;">
                <div class="page-sub">
                    第 <b th:text="${(currentPage - 1) * pageSize + 1}">1</b>–<b th:text="${(currentPage - 1) * pageSize + #lists.size(projects)}">20</b> 个
                    / 共 <b th:text="${totalRows}">0</b> 个
                    <span th:if="${totalPages <= 1}" th:text="|· 一页装得下（每页 ${pageSize} 个）|"></span>
                </div>
                <nav>
                    <ul class="pagination mb-0">
                        <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/projects(keyword=${keyword}, page=${currentPage - 1})}">&laquo; 上一页</a>
                        </li>
                        <li class="page-item" th:each="i : ${pageNumbers}"
                            th:classappend="${i != 0 and i == currentPage} ? 'active'">
                            <a th:if="${i != 0}" class="page-link" th:href="@{/projects(keyword=${keyword}, page=${i})}" th:text="${i}">1</a>
                            <span th:if="${i == 0}" class="page-link disabled-link text-muted">&hellip;</span>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/projects(keyword=${keyword}, page=${currentPage + 1})}">下一页 &raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- 新建项目 -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form th:action="@{/projects/save}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">新建项目</h5>
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>项目名称 *</label>
                            <input type="text" name="name" class="form-control" required placeholder="如：回金算">
                        </div>
                        <div class="form-group">
                            <label>项目编码 *（英文唯一）</label>
                            <input type="text" name="projectCode" class="form-control" required placeholder="如：huijinsuan">
                        </div>
                        <div class="form-group">
                            <label>别名（逗号分隔，用于模糊搜索）</label>
                            <input type="text" name="aliases" class="form-control" placeholder="如：废旧件系统,HJS">
                        </div>
                        <div class="form-group">
                            <label>描述</label>
                            <textarea name="description" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label>默认测试命令（工作流模板用）</label>
                            <input type="text" name="defaultTestCmd" class="form-control" placeholder="如：mvn test">
                        </div>
                        <div class="form-group">
                            <label>默认约束（工作流模板用）</label>
                            <textarea name="defaultConstraints" class="form-control" rows="2" placeholder="如：不新增第三方依赖"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">创建</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/jquery/jquery.min.js}"></script>
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('新建派单')}"></head>
<body>
<div class="page">
    <a th:href="@{/m/dispatch}" class="muted" style="font-size:13px;display:inline-block;margin-bottom:10px">‹ 返回列表</a>

    <div th:if="${error}" class="card" style="border:1px solid var(--danger)">
        <div style="color:var(--danger);white-space:pre-wrap" th:text="${error}"></div>
    </div>

    <div class="h1">新建派单</div>
    <div class="muted" style="margin-bottom:14px">
        建完是「待审核」，还要你再点一次通过才会派出去。
    </div>

    <form th:action="@{/m/dispatch/create}" method="post">
        <div class="h2" style="margin-top:0">标题</div>
        <input type="text" name="title" required maxlength="200" placeholder="一句话说清要干什么">

        <div class="h2">内容描述</div>
        <textarea name="description" rows="8" required
                  placeholder="背景 / 要做什么 / 验收标准 —— 哨兵只能看到这段，写清楚它才不会跑偏"></textarea>

        <div class="h2">指派给</div>
        <select name="assignee" required>
            <option value="">— 选一个哨兵 —</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
        </select>

        <div class="h2">优先级</div>
        <select name="priority">
            <option value="1">1 · 高</option>
            <option value="3" selected>3 · 中</option>
            <option value="5">5 · 低</option>
        </select>

        <div class="h2">备注</div>
        <input type="text" name="remark" placeholder="只给你自己看，不进业务判断">

        <div class="h2">授权位</div>
        <div class="card">
            <div class="muted" style="margin-bottom:8px;font-size:12px">
                一个都不勾 = 这单只能读，哨兵只能出方案不能动手。
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:14px">
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="modifyCode" style="width:auto">修改代码</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="commit" style="width:auto">commit</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="push" style="width:auto">push</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="release" id="authRelease" style="width:auto"
                           onchange="toggleVersion()">发版</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="dataWrite" style="width:auto">数据写入</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="migration" style="width:auto">数据库迁移</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="credential" style="width:auto">凭证/密钥</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="prodConfig" style="width:auto">生产配置</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="securityGroup" style="width:auto">安全组</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="firewall" style="width:auto">防火墙</label>
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <input type="checkbox" name="spend" style="width:auto">花钱</label>
            </div>
            <div id="versionBox" style="margin-top:8px;display:none">
                <input type="text" name="version"
                       th:attr="placeholder='版本号，不填默认 ' + ${suggestedVersion}">
                <div class="muted" style="font-size:12px;margin-top:4px">
                    不填就按同项目上一张带版本的单 +1，当前推算 <b th:text="${suggestedVersion}"></b>。
                </div>
            </div>
        </div>

        <button type="submit" class="btn" style="margin-top:14px">建单（进待审核）</button>
        <a th:href="@{/m/dispatch}" class="btn ghost" style="margin-top:8px;display:block;text-align:center;line-height:22px">取消</a>
    </form>
</div>

<nav th:replace="~{m/layout :: tabbar('dispatch')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>

<script>
function toggleVersion() {
    var el = document.getElementById('authRelease');
    var box = document.getElementById('versionBox');
    if (el && box) box.style.display = el.checked ? 'block' : 'none';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('派单')}"></head>
<body class="bg-base-100 text-base-content">
<div class="page">

    <header class="app-bar -mx-4 -mt-3 mb-3 px-4">
        <div class="flex-1 min-w-0">
            <h1>派单</h1>
            <div class="text-xs opacity-50 mt-0.5">待审核 <b th:text="${counts['REVIEWING']} ?: 0">0</b>
                · 待接单 <b th:text="${counts['READY']} ?: 0">0</b>
                · 待确认 <b th:text="${counts['CONFIRMING']} ?: 0">0</b>
                · 待验收 <b th:text="${counts['VERIFYING']} ?: 0">0</b>
            </div>
        </div>
        <a class="btn btn-primary btn-sm" th:href="@{/m/dispatch/new}">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            新建
        </a>
    </header>

    <div th:if="${success}" role="alert" class="alert alert-success mb-3 items-start">
        <div class="flex-1 min-w-0 pre-wrap text-sm" th:text="${success}"></div>
    </div>
    <div th:if="${error}" role="alert" class="alert alert-error mb-3 items-start">
        <div class="flex-1 min-w-0 pre-wrap text-sm" th:text="${error}"></div>
    </div>

    <!-- 状态筛选：横向可滑。手机窄，六个按钮平铺会挤成两行小字 -->
    <div class="hscroll flex gap-2 mb-3 -mx-4 px-4">
        <a class="btn btn-sm shrink-0" th:classappend="${status == null or status == ''} ? 'btn-primary' : 'btn-ghost bg-base-200'"
           th:href="@{/m/dispatch}">全部</a>
        <a class="btn btn-sm shrink-0" th:classappend="${status == 'REVIEWING'} ? 'btn-primary' : 'btn-ghost bg-base-200'"
           th:href="@{/m/dispatch(status='REVIEWING')}">待审核</a>
        <a class="btn btn-sm shrink-0" th:classappend="${status == 'READY'} ? 'btn-primary' : 'btn-ghost bg-base-200'"
           th:href="@{/m/dispatch(status='READY')}">待接单</a>
        <a class="btn btn-sm shrink-0" th:classappend="${status == 'RUNNING'} ? 'btn-primary' : 'btn-ghost bg-base-200'"
           th:href="@{/m/dispatch(status='RUNNING')}">进行中</a>
        <a class="btn btn-sm shrink-0" th:classappend="${status == 'CONFIRMING'} ? 'btn-primary' : 'btn-ghost bg-base-200'"
           th:href="@{/m/dispatch(status='CONFIRMING')}">待确认</a>
        <a class="btn btn-sm shrink-0" th:classappend="${status == 'VERIFYING'} ? 'btn-primary' : 'btn-ghost bg-base-200'"
           th:href="@{/m/dispatch(status='VERIFYING')}">待验收</a>
    </div>

    <div class="flex flex-col gap-2">
        <a th:each="o : ${orders}" class="card bg-base-200 shadow-sm tap" th:href="@{'/m/dispatch/' + ${o.orderNo}}">
            <div class="card-body p-3.5 gap-0">
                <div class="flex items-start gap-2">
                    <div class="flex-1 min-w-0 text-[15px] font-semibold leading-snug" th:text="${o.title}">标题</div>
                    <!-- 状态色两端（PC / 手机）同一张色表：
                         待审核 琥珀 · 待接单 蓝 · 进行中 青 · 待确认 紫 · 待验收 红 · 完成 绿 · 取消 灰。
                         左边小圆点是给「扫列表」用的 —— 一屏十几张卡，先认色点再读字。 -->
                    <span class="tag" th:classappend="'tag-' + ${o.status}"
                          th:text="${labels[o.status]}">状态</span>
                </div>
                <div class="flex items-center justify-between mt-1.5">
                    <span class="text-[11px] opacity-40 tnum" th:text="${o.orderNo}"></span>
                    <span class="text-[11px] opacity-40 tnum"
                          th:text="${o.updatedAt != null ? #temporals.format(o.updatedAt,'MM-dd HH:mm') : ''}"></span>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2">
                    <span class="badge badge-sm badge-ghost" th:text="${o.origin == 'HUMAN' ? '人工' : 'AI'}">来源</span>
                    <span class="badge badge-sm badge-ghost" th:text="'→ ' + ${o.assignee}">指派</span>
                    <span class="badge badge-sm badge-ghost" th:if="${o.accepter != null}" th:text="'接了 ' + ${o.accepter}">接单</span>
                    <span class="badge badge-sm badge-error badge-soft" th:if="${o.priority != null and o.priority == 1}">高优</span>
                    <span class="badge badge-sm badge-ghost tnum" th:if="${o.version != null and !o.version.isEmpty()}" th:text="${o.version}">版本</span>
                </div>
            </div>
        </a>
    </div>

    <div class="flex flex-col items-center gap-1.5 py-16 opacity-45" th:if="${orders.isEmpty()}">
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        <div class="text-sm font-medium mt-1">这个筛选下没有单</div>
        <div class="text-xs text-center px-8 leading-relaxed">AI 建的单会落在「待审核」，等你通过才会派出去。</div>
    </div>

    <div class="text-center text-[11px] opacity-30 mt-5 leading-relaxed">
        审核 / 验收 / 取消只能在这页（和 PC 后台）做，MCP 里没有这些动作 —— 闸门在人手里。
    </div>
</div>

<nav th:replace="~{m/layout :: tabbar('dispatch')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>
</body>
</html>

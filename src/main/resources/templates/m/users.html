<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('用户')}"></head>
<body class="bg-base-100 text-base-content">
<div class="page">

    <header class="app-bar -mx-4 -mt-3 mb-3 px-4">
        <div class="flex-1 min-w-0">
            <h1>用户</h1>
            <div class="text-xs opacity-50 mt-0.5 truncate" id="subtitle">加载中…</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-circle" id="refreshBtn" aria-label="刷新">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
    </header>

    <!-- 两类用户是两个不同的东西，不要混在一个列表里：
         门户用户是「人」，AI 助手是「带 Key 的机器身份」，判据和关注点完全不同 -->
    <div role="tablist" class="tabs tabs-box bg-base-200 p-1 mb-3">
        <button role="tab" class="tab tab-active flex-1 text-[13px] h-9" data-tab="users">门户用户</button>
        <button role="tab" class="tab flex-1 text-[13px] h-9" data-tab="assistants">AI 助手</button>
    </div>

    <div role="alert" class="alert alert-error mb-3 items-start" id="errBox" style="display:none">
        <div class="flex-1 min-w-0">
            <div class="font-medium">加载失败</div>
            <div class="text-sm opacity-85 mt-1 pre-wrap" id="errMsg"></div>
            <button class="btn btn-sm btn-ghost mt-2.5" id="retryBtn">重试</button>
        </div>
    </div>

    <!-- ========== 门户用户 ========== -->
    <div id="pane-users">
        <div class="grid grid-cols-3 gap-2 mb-3">
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">总用户</div>
                    <div class="text-xl font-semibold tnum" id="u-total">—</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">今日新增</div>
                    <div class="text-xl font-semibold tnum" id="u-today">—</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">7 日活跃</div>
                    <div class="text-xl font-semibold tnum" id="u-active">—</div>
                </div>
            </div>
        </div>

        <label class="input input-sm flex items-center gap-2 w-full mb-3 h-10">
            <svg class="w-4 h-4 opacity-40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="userSearch" placeholder="搜邮箱或昵称" autocomplete="off">
        </label>

        <div id="userList" class="flex flex-col gap-2"></div>
        <div id="userHint" class="text-center text-xs opacity-40 py-4" style="display:none"></div>
        <div id="userSentinel" style="height:1px"></div>
    </div>

    <!-- ========== AI 助手 ========== -->
    <div id="pane-assistants" style="display:none">
        <div class="grid grid-cols-3 gap-2 mb-3">
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">助手</div>
                    <div class="text-xl font-semibold tnum" id="a-total">—</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">启用中</div>
                    <div class="text-xl font-semibold tnum" id="a-enabled">—</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">总调用</div>
                    <div class="text-xl font-semibold tnum" id="a-calls">—</div>
                </div>
            </div>
        </div>

        <div id="assistantList" class="flex flex-col gap-2"></div>
        <div id="assistantHint" class="text-center text-xs opacity-40 py-4" style="display:none"></div>
    </div>

    <div class="text-center text-[11px] opacity-30 mt-5" id="updatedAt"></div>
</div>

<nav th:replace="~{m/layout :: tabbar('users')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>

<script th:inline="javascript">
    // contextPath 用 @{/}（不要用 servlet 请求对象，Thymeleaf 3.1 下为 null 会炸模板）
    var CTX = /*[[@{/}]]*/ '/';
    CTX = CTX.replace(/\/$/, '');

    var uPage = 1, uPages = 1, uLoading = false, uKeyword = '', uTotal = 0;
    var assistantLoaded = false;

    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
    }

    function num(v, digits) {
        if (v === null || v === undefined || v === '') return '0';
        var n = Number(v);
        if (isNaN(n)) return String(v);
        return digits === undefined ? n.toLocaleString('zh-CN') : n.toFixed(digits);
    }

    function setText(id, t) {
        var el = document.getElementById(id);
        if (el) el.textContent = t;
    }

    function showError(msg) {
        setText('errMsg', msg);
        document.getElementById('errBox').style.display = 'flex';
        setText('subtitle', '加载失败');
    }

    function clearError() {
        document.getElementById('errBox').style.display = 'none';
    }

    function getJson(url) {
        return fetch(url, { credentials: 'same-origin' }).then(function (r) {
            if (r.status === 401 || r.status === 403) throw new Error('登录已过期，请重新登录（HTTP ' + r.status + '）');
            if (!r.ok) throw new Error('服务端返回 HTTP ' + r.status);
            return r.json();
        }).then(function (res) {
            if (res.code !== 0) throw new Error(res.message || '接口返回失败');
            return res.data;
        });
    }

    /** 2026-11-08T01:23:45 -> 11-08 01:23；空值给「从未」而不是「—」，因为对用户来说这两者含义不同 */
    function fmtTime(s, emptyText) {
        if (!s) return emptyText || '—';
        var t = String(s).replace('T', ' ');
        if (t.length < 16) return t;
        return t.substring(5, 16);
    }

    // ---------- 门户用户 ----------
    function userCard(u) {
        // 停用状态用 badge-soft：实心红在列表里太吵，一屏三张红卡片会让人以为全挂了
        var statusTag = u.enabled === false
            ? '<span class="badge badge-error badge-sm badge-soft shrink-0">已停用</span>'
            : '<span class="badge badge-success badge-sm badge-soft shrink-0">正常</span>';
        return '<div class="card bg-base-200 shadow-sm">'
            + '<div class="card-body p-3.5 gap-0">'
            + '<div class="flex items-center gap-2">'
            + '<div class="flex-1 min-w-0 text-[15px] font-semibold truncate">' + esc(u.displayName || '（未设昵称）') + '</div>'
            + statusTag
            + '</div>'
            + '<div class="text-xs opacity-50 truncate mt-0.5">' + esc(u.email || '—') + '</div>'
            + '<div class="h-px bg-base-300 my-2.5"></div>'
            + '<div class="flex items-center justify-between text-[11px] opacity-55 tnum">'
            + '<span>注册 ' + fmtTime(u.createdAt) + '</span>'
            + '<span>最后登录 ' + fmtTime(u.lastLoginAt, '从未') + '</span>'
            + '</div>'
            + '<div class="flex items-center justify-between text-[11px] opacity-55 mt-1.5 tnum">'
            + '<span>经验文档 ' + num(u.docCount) + ' 篇</span>'
            + '<span>#' + u.id + '</span>'
            + '</div>'
            + '</div></div>';
    }

    function loadUsers(reset) {
        if (uLoading) return;
        uLoading = true;
        clearError();

        if (reset) {
            uPage = 1;
            uPages = 1;
            document.getElementById('userList').innerHTML = '';
        }

        var url = CTX + '/api/mobile/users?page=' + uPage + '&size=20';
        if (uKeyword) url += '&keyword=' + encodeURIComponent(uKeyword);

        getJson(url).then(function (d) {
            var rows = d.list || [];
            uPages = d.pages || 1;
            uTotal = d.total || 0;

            if (rows.length) {
                document.getElementById('userList')
                    .insertAdjacentHTML('beforeend', rows.map(userCard).join(''));
            }

            var s = d.summary || {};
            setText('u-total', s.total === null || s.total === undefined ? '—' : num(s.total));
            setText('u-today', s.todayNew === null || s.todayNew === undefined ? '—' : num(s.todayNew));
            setText('u-active', s.active7d === null || s.active7d === undefined ? '—' : num(s.active7d));

            if (uPage === 1 && !rows.length) {
                document.getElementById('userList').innerHTML =
                    '<div class="flex flex-col items-center gap-1 py-14 opacity-45">'
                    + '<div class="text-sm font-medium">' + (uKeyword ? '没有匹配的用户' : '还没有注册用户') + '</div>'
                    + (uKeyword ? '<div class="text-xs">换个关键词试试</div>' : '')
                    + '</div>';
            }

            setText('subtitle', (uKeyword ? '搜索「' + uKeyword + '」· ' : '') + uTotal + ' 个门户用户');

            var hint = document.getElementById('userHint');
            if (uPage < uPages) {
                hint.style.display = 'block';
                hint.textContent = '继续下滑加载更多…';
            } else {
                hint.style.display = 'none';
            }
        }).catch(function (e) {
            showError(e.message || String(e));
        }).then(function () {
            uLoading = false;
        });
    }

    // ---------- AI 助手 ----------
    function assistantCard(a) {
        var perms = [];
        if (a.canSearch) perms.push('查');
        if (a.canCreate) perms.push('建');
        if (a.canUpdate) perms.push('改');

        var total = Number(a.totalCalls || 0);
        var ok = Number(a.successCalls || 0);
        var rate = total > 0 ? (ok / total) * 100 : null;

        return '<div class="card bg-base-200 shadow-sm">'
            + '<div class="card-body p-3.5 gap-0">'
            + '<div class="flex items-center gap-2">'
            + '<div class="flex-1 min-w-0 text-[15px] font-semibold truncate">' + esc(a.assistantName || '（未命名）') + '</div>'
            + (a.enabled === false
                ? '<span class="badge badge-error badge-sm badge-soft shrink-0">已停用</span>'
                : '<span class="badge badge-success badge-sm badge-soft shrink-0">启用</span>')
            + '</div>'
            + (a.description
                ? '<div class="text-xs opacity-55 mt-1 line-clamp-2 leading-relaxed">' + esc(a.description) + '</div>'
                : '')
            + '<div class="h-px bg-base-300 my-2.5"></div>'
            + '<div class="flex items-center justify-between text-[11px] opacity-55 tnum">'
            + '<span>调用 ' + num(total) + ' 次'
            + (rate === null ? '' : ' · 成功率 ' + rate.toFixed(0) + '%') + '</span>'
            + '<span>失败 ' + num(a.failCalls) + '</span>'
            + '</div>'
            + '<div class="flex items-center justify-between text-[11px] opacity-45 mt-1.5 gap-2">'
            // apiKey 后端已做掩码（只回前后几位），别改成调 /api/assistants/{id}，那个接口回明文
            + '<span class="truncate font-mono">' + esc(a.apiKey || '—') + '</span>'
            + '<span class="whitespace-nowrap">最后 ' + fmtTime(a.lastCallAt, '从未调用') + '</span>'
            + '</div>'
            + '<div class="flex gap-1.5 mt-2.5">'
            + (perms.length
                ? perms.map(function (p) {
                    return '<span class="badge badge-ghost badge-sm">' + p + '</span>';
                }).join('')
                : '<span class="badge badge-error badge-sm badge-soft">无权限</span>')
            + '</div>'
            + '</div></div>';
    }

    function loadAssistants() {
        if (assistantLoaded) return;
        clearError();

        // 助手数量是几十的量级，一次拉 50 条足够；真超过再翻页，不必一上来就做无限滚动
        getJson(CTX + '/api/assistants?page=1&size=50').then(function (d) {
            var rows = d.list || [];
            assistantLoaded = true;

            var enabled = rows.filter(function (a) { return a.enabled !== false; }).length;
            var calls = rows.reduce(function (sum, a) { return sum + Number(a.totalCalls || 0); }, 0);

            setText('a-total', num(d.total || rows.length));
            setText('a-enabled', num(enabled));
            setText('a-calls', num(calls));

            document.getElementById('assistantList').innerHTML = rows.length
                ? rows.map(assistantCard).join('')
                : '<div class="flex flex-col items-center gap-1 py-14 opacity-45">'
                  + '<div class="text-sm font-medium">还没有创建过 AI 助手</div>'
                  + '<div class="text-xs">在 PC 后台创建后会出现在这里</div></div>';

            var hint = document.getElementById('assistantHint');
            if ((d.total || 0) > rows.length) {
                hint.style.display = 'block';
                hint.textContent = '共 ' + d.total + ' 个，只显示前 ' + rows.length + ' 个';
            } else {
                hint.style.display = 'none';
            }
        }).catch(function (e) {
            showError(e.message || String(e));
        });
    }

    // ---------- 交互 ----------
    var searchTimer = null;
    document.getElementById('userSearch').addEventListener('input', function () {
        var v = this.value.trim();
        clearTimeout(searchTimer);
        // 防抖 400ms：手机上每敲一个字就发一次请求，弱网下会互相覆盖，看起来像"搜不出东西"
        searchTimer = setTimeout(function () {
            uKeyword = v;
            loadUsers(true);
        }, 400);
    });

    document.querySelectorAll('[data-tab]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var tab = btn.getAttribute('data-tab');
            document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.remove('tab-active'); });
            btn.classList.add('tab-active');

            document.getElementById('pane-users').style.display = tab === 'users' ? 'block' : 'none';
            document.getElementById('pane-assistants').style.display = tab === 'assistants' ? 'block' : 'none';

            if (tab === 'assistants') {
                loadAssistants();
                setText('subtitle', 'AI 助手与 API Key');
            } else {
                setText('subtitle', uTotal + ' 个门户用户');
            }
        });
    });

    document.getElementById('refreshBtn').addEventListener('click', function () {
        clearError();
        loadUsers(true);
        if (document.getElementById('pane-assistants').style.display !== 'none') {
            assistantLoaded = false;
            loadAssistants();
        }
        setText('updatedAt', '数据更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
    });
    document.getElementById('retryBtn').addEventListener('click', function () {
        clearError();
        loadUsers(true);
        if (document.getElementById('pane-assistants').style.display !== 'none') {
            assistantLoaded = false;
            loadAssistants();
        }
    });

    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            if (!entries[0].isIntersecting) return;
            if (uLoading || uPage >= uPages) return;
            uPage += 1;
            loadUsers(false);
        }, { rootMargin: '200px' }).observe(document.getElementById('userSentinel'));
    }

    loadUsers(true);
</script>
</body>
</html>

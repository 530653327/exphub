<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('待删')}"></head>
<body class="bg-base-100 text-base-content">
<div class="page">

    <header class="app-bar -mx-4 -mt-3 mb-3 px-4">
        <div class="flex-1 min-w-0">
            <h1>待删队列</h1>
            <div class="text-xs opacity-50 mt-0.5 truncate" id="subtitle">加载中…</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-circle" id="refreshBtn" aria-label="刷新">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
    </header>

    <!-- 删除成功：删除是物理删除，必须明确告诉人「已经没了、恢复不了」，不能只悄悄少一条卡片 -->
    <div role="alert" class="alert alert-success mb-3" id="okBanner" style="display:none">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg>
        <div>
            <div class="font-medium">已删除</div>
            <div class="text-sm opacity-80">这条经验已从库里彻底删除，不可恢复。</div>
        </div>
    </div>

    <!-- 错误必须显眼。2026-11-08 白屏事故的教训：手机上「看不清的错误」等于「没有错误」 -->
    <div role="alert" class="alert alert-error mb-3 items-start" id="errBox" style="display:none">
        <div class="flex-1 min-w-0">
            <div class="font-medium">加载失败</div>
            <div class="text-sm opacity-85 mt-1 pre-wrap" id="errMsg"></div>
            <button class="btn btn-sm btn-ghost mt-2.5" id="retryBtn">重试</button>
        </div>
    </div>

    <div id="list" class="flex flex-col gap-2"></div>

    <div id="emptyBox" class="hidden flex-col items-center gap-1.5 py-16 opacity-50">
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        <div class="text-sm font-medium mt-1">队列是空的</div>
        <div class="text-xs text-center px-8 leading-relaxed">AI 标记待删的经验会出现在这里，等你确认后才会真正删除。</div>
    </div>

    <div id="moreHint" class="text-center text-xs opacity-40 py-4" style="display:none"></div>
    <div id="sentinel" style="height:1px"></div>
</div>

<nav th:replace="~{m/layout :: tabbar('pending')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>

<script th:inline="javascript">
    // contextPath 用 @{/}（不要用 servlet 请求对象，Thymeleaf 3.1 下为 null 会炸模板）
    var CTX = /*[[@{/}]]*/ '/';
    CTX = CTX.replace(/\/$/, '');

    var CSRF = (document.querySelector('meta[name="_csrf"]') || {}).content || '';

    var page = 1, totalPages = 1, total = 0, loading = false;
    var expanded = {};   // id -> true，正文已加载

    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
    }

    function fmtTime(s) {
        if (!s) return '—';
        // 后端给 2026-11-08T01:23:45 这种串，手机上只要 MM-dd HH:mm
        var t = String(s).replace('T', ' ');
        return t.length >= 16 ? t.substring(5, 16) : t;
    }

    function showError(msg) {
        document.getElementById('errMsg').textContent = msg;
        document.getElementById('errBox').style.display = 'flex';
        document.getElementById('subtitle').textContent = '加载失败';
    }

    function cardHtml(d) {
        // 标记原因单独一块底色：删之前人最想看的就是「凭什么删」，
        // 混在正文里会被摘要吃掉
        var reason = d.deleteReason
            ? '<div class="rounded-xl bg-base-300/60 px-3 py-2.5 mt-2.5">'
              + '<div class="text-[11px] opacity-50 mb-0.5">标记原因</div>'
              + '<div class="text-sm leading-relaxed">' + esc(d.deleteReason) + '</div></div>'
            : '<div class="text-[11px] opacity-35 mt-2">（标记时未写原因）</div>';

        return '<div class="card bg-base-200 shadow-sm" data-id="' + d.id + '">'
            + '<div class="card-body p-3.5 gap-0">'
            + '<div class="text-[15px] font-semibold leading-snug">' + esc(d.title || '（无标题）') + '</div>'
            + '<div class="text-[11px] opacity-45 mt-1 tnum">#'
            + d.id + ' · ' + esc(d.category || '未分类')
            + ' · ' + esc(d.authorName || '—')
            + ' · ' + (d.contentLength || 0) + ' 字</div>'
            + (d.summary ? '<div class="text-sm opacity-65 mt-2 line-clamp-2 leading-relaxed">' + esc(d.summary) + '</div>' : '')
            + reason
            + '<div class="text-[11px] opacity-35 mt-2">'
            + esc(d.markedBy || '—') + ' 于 ' + fmtTime(d.markedAt) + ' 标记</div>'
            + '<div id="body-' + d.id + '" style="display:none" class="mt-3 pt-3 border-t border-base-300">'
            + '<div class="pre-wrap text-sm leading-relaxed"></div></div>'
            + '<div class="flex gap-2 mt-3">'
            + '<button class="btn btn-ghost btn-sm flex-1" data-act="view" data-id="' + d.id + '">看正文</button>'
            + '<button class="btn btn-sm btn-outline btn-error flex-1" data-act="del" data-id="' + d.id + '">删除</button>'
            + '</div></div></div>';
    }

    function load(reset) {
        if (loading) return;
        loading = true;
        document.getElementById('errBox').style.display = 'none';
        if (reset) {
            page = 1;
            totalPages = 1;
            document.getElementById('list').innerHTML = '';
            document.getElementById('emptyBox').classList.add('hidden');
        }
        document.getElementById('subtitle').textContent = '加载中…';

        fetch(CTX + '/api/docs/pending?page=' + page + '&size=20', { credentials: 'same-origin' })
            .then(function (r) {
                if (r.status === 401 || r.status === 403) throw new Error('登录已过期，请重新登录（HTTP ' + r.status + '）');
                if (!r.ok) throw new Error('服务端返回 HTTP ' + r.status);
                return r.json();
            })
            .then(function (res) {
                if (res.code !== 0) throw new Error(res.message || '接口返回失败');
                var data = res.data || {};
                total = data.total || 0;
                totalPages = data.pages || 1;
                var rows = data.list || [];

                if (rows.length) {
                    document.getElementById('list')
                        .insertAdjacentHTML('beforeend', rows.map(cardHtml).join(''));
                }

                document.getElementById('subtitle').textContent = total
                    ? total + ' 条等待确认' + (totalPages > 1 ? '（第 ' + page + '/' + totalPages + ' 页）' : '')
                    : '队列是空的';
                // emptyBox 是 flex 布局，靠 hidden 切换而不是 display:block/none，否则图标和文字会挤成一行
                document.getElementById('emptyBox').classList.toggle('hidden', !!total);
                document.getElementById('emptyBox').classList.toggle('flex', !total);

                var hint = document.getElementById('moreHint');
                if (page < totalPages) {
                    hint.style.display = 'block';
                    hint.textContent = '继续下滑加载更多…';
                } else {
                    hint.style.display = 'none';
                }
            })
            .catch(function (e) {
                showError(e.message || String(e));
            })
            .then(function () {
                loading = false;
            });
    }

    function loadMore() {
        if (loading || page >= totalPages) return;
        page += 1;
        load(false);
    }

    function toggleBody(id, btn) {
        var box = document.getElementById('body-' + id);
        if (expanded[id]) {
            var open = box.style.display !== 'none';
            box.style.display = open ? 'none' : 'block';
            btn.textContent = open ? '看正文' : '收起';
            return;
        }
        btn.textContent = '加载中…';
        btn.disabled = true;

        fetch(CTX + '/api/docs/' + id, { credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (res.code !== 0) throw new Error(res.message || '读不到正文');
                var content = (res.data && res.data.content) || '（正文为空）';
                box.querySelector('div').textContent = content;
                box.style.display = 'block';
                expanded[id] = true;
                btn.textContent = '收起';
            })
            .catch(function (e) {
                btn.textContent = '看正文';
                showError('读正文失败：' + (e.message || e));
            })
            .then(function () {
                btn.disabled = false;
            });
    }

    /**
     * 二次确认：第一次点变红并改文案，3 秒内再点才真删。
     * 不做「撤销」—— docService.delete 是物理删除，没有回滚数据，
     * 给一个假的撤销按钮比不给更危险（会让人以为删错了还能救）。
     */
    function armOrDelete(id, btn) {
        if (btn.dataset.armed === '1') {
            doDelete(id);
            return;
        }
        btn.dataset.armed = '1';
        // 已 armed：去掉描边换成实心红，手指按下去那一下就知道「这一下是真删」
        btn.classList.remove('btn-outline');
        btn.classList.add('btn-error');
        btn.textContent = '确认删除？';
        setTimeout(function () {
            if (btn.dataset.armed === '1') {
                btn.dataset.armed = '0';
                btn.classList.add('btn-outline');
                btn.classList.remove('btn-error');
                btn.textContent = '删除';
            }
        }, 3000);
    }

    function doDelete(id) {
        // 用原生表单提交而不是 fetch：删除接口返回 302，服务端按会话标记跳回 /m/pending，
        // 浏览器整页跳转最稳，也不用担心 fetch 跟随重定向后拿到的是 PC 页面的 HTML。
        var f = document.createElement('form');
        f.method = 'POST';
        f.action = CTX + '/docs/' + id + '/delete';

        var t = document.createElement('input');
        t.type = 'hidden';
        t.name = '_csrf';
        t.value = CSRF;
        f.appendChild(t);

        document.body.appendChild(f);
        f.submit();
    }

    document.getElementById('list').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        if (btn.getAttribute('data-act') === 'view') toggleBody(id, btn);
        else armOrDelete(id, btn);
    });

    document.getElementById('refreshBtn').addEventListener('click', function () { load(true); });
    document.getElementById('retryBtn').addEventListener('click', function () { load(true); });

    // 滚到底自动加载下一页
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) loadMore();
        }, { rootMargin: '200px' }).observe(document.getElementById('sentinel'));
    }

    // 删除成功回来会带 ?deleted=1
    if (/(^|[?&])deleted=1(&|$)/.test(location.search)) {
        document.getElementById('okBanner').style.display = 'flex';
        // 把参数从地址栏抹掉，刷新不会重复弹
        history.replaceState(null, '', location.pathname);
    }

    load(true);
</script>
</body>
</html>

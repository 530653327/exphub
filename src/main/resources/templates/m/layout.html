<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  移动端公共壳（2026-11-08 起）。

  三件事只在这里做：
    1. 视口/安全区/PWA 元信息 —— 每页各写一遍迟早漂
    2. 底部 Tab 导航 —— 四个入口固定，不加第五个（加了就要重排整个底栏）
    3. Service Worker 注册 —— 只在移动壳注册，PC 后台不注册，免得缓存互相干扰

  刻意的取舍：不引任何 CDN。手机在弱网/地铁里 CDN 抖动会让整页白屏，
  这些样式统共不到 200 行，内联比多一个外链更可靠。
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <!-- CSRF：移动端后续的写操作（删除待删文档等）要带 token，这里与 PC 的 layout/base.html 口径一致。
         _csrf 为 null 时给空串，页面照常渲染（登录页也可能没有）。 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#1e1e2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="经验阁">
    <meta name="format-detection" content="telephone=no">
    <title th:text="${title} + ' · 经验阁'">经验阁</title>
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="apple-touch-icon" th:href="@{/images/pwa/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/pwa/favicon-32.png}">
    <script th:src="@{/js/csrf.js}"></script>
    <style th:inline="css">
        :root {
            color-scheme: dark;
            --bg: #1e1e2e;
            --card: #262637;
            --card-2: #2e2e42;
            --line: #35354d;
            --text: #f2f2f7;
            --muted: #9a9ab0;
            --accent: #6366f1;
            --ok: #34d399;
            --warn: #fbbf24;
            --danger: #f87171;
            --tab-h: 56px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        .page { padding: 12px 14px 20px; }
        .h1 { font-size: 20px; font-weight: 600; margin: 6px 2px 14px; }
        .h2 { font-size: 14px; color: var(--muted); margin: 18px 2px 8px; font-weight: 500; }
        .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .row { display: flex; align-items: center; gap: 10px; }
        .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .grow { flex: 1; min-width: 0; }
        .num { font-size: 26px; font-weight: 600; letter-spacing: -.5px; }
        .muted { color: var(--muted); font-size: 13px; }
        .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tag {
            display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px;
            background: var(--card-2); color: var(--muted);
        }
        .tag.ok { color: var(--ok); }
        .tag.warn { color: var(--warn); }
        .tag.danger { color: var(--danger); }
        .btn {
            appearance: none; border: 0; border-radius: 10px; padding: 11px 16px;
            font-size: 15px; font-weight: 500; background: var(--accent); color: #fff;
            min-height: 44px; width: 100%;
        }
        .btn:active { opacity: .82; }
        .btn.ghost { background: var(--card-2); color: var(--text); }
        .btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn:disabled { opacity: .45; }
        /* 时间窗口切换（工具埋点用）：选中的那一个用品牌色描边，别只靠背景深浅 ——
           手机上深色背景下背景色差 8% 基本看不出来 */
        .chip { flex: 1; }
        .chip.active {
            background: rgba(99, 102, 241, .16);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }
        input, select, textarea {
            width: 100%; background: var(--card-2); border: 1px solid var(--line); color: var(--text);
            border-radius: 10px; padding: 12px 14px; font-size: 16px; /* 16px 否则 iOS 聚焦会放大页面 */
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; }
        .divider { height: 1px; background: var(--line); margin: 12px 0; }
        .tabbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            height: calc(var(--tab-h) + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            display: flex; background: rgba(30, 30, 46, .96);
            border-top: 1px solid var(--line);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .tab {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; font-size: 11px; color: var(--muted);
        }
        .tab.active { color: var(--accent); }
        .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .install-hint {
            position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
            background: var(--card-2); border: 1px solid var(--line); border-radius: 14px;
            padding: 12px 14px; font-size: 13px; display: none; z-index: 60;
        }
        .install-hint.show { display: block; }
    </style>
</head>
<body>

<!-- 底部导航：四项固定。activeTab 传 dashboard / pending / tools / me -->
<nav class="tabbar" th:fragment="tabbar(activeTab)">
    <a class="tab" th:classappend="${activeTab == 'dashboard'} ? 'active'" th:href="@{/m/dashboard}">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg>
        <span>看板</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'pending'} ? 'active'" th:href="@{/m/pending}">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg>
        <span>待删</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'tools'} ? 'active'" th:href="@{/m/tools}">
        <svg viewBox="0 0 24 24"><path d="M4 19V9M9.5 19V5M15 19v-7M20.5 19v-4"/></svg>
        <span>埋点</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'me'} ? 'active'" th:href="@{/m/me}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4S18.3 16.4 19.5 20"/></svg>
        <span>我的</span>
    </a>
</nav>

<!-- PWA 注册 + 安装引导：只在移动壳里跑 -->
<th:block th:fragment="pwa">
    <div class="install-hint" id="installHint">
        <div class="row-between">
            <div class="grow">
                <div style="font-weight:500;margin-bottom:2px">装到桌面更好用</div>
                <div class="muted" id="installHintText">点下方按钮添加到主屏幕，像一个 App 一样打开</div>
            </div>
            <button class="btn" style="width:auto;padding:8px 14px;font-size:14px" id="installBtn">安装</button>
        </div>
    </div>
    <script th:inline="javascript">
        (function () {
            // 2026-11-08 修正（这是本页第一次上线就白屏的根因）：
            // 原来用 servlet 请求对象取 contextPath，它在 Thymeleaf 3.1 下求值为 null，
            // 对 null 取属性直接抛 TemplateProcessingException。而 HTML 是边渲染边输出的，
            // 异常发生时响应已提交 —— 错误页渲染不出来，浏览器只收到半截 HTML，
            // 表现就是「深灰背景、什么都没有」，而且 HTTP 还是 200，监控完全看不见。
            // 改用 @{/}：contextPath 由 Thymeleaf 自己拼，不依赖 model 属性、也不依赖 request 对象。
            var ctx = /*[[@{/}]]*/ '/';
            ctx = ctx.replace(/\/$/, '');
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register(ctx + '/sw.js').catch(function (e) {
                        // 注册失败不影响使用，但要在控制台留痕，否则「为什么装不上」无从查起
                        console.warn('SW 注册失败', e);
                    });
                });
            }

            // Android/Chrome：支持 beforeinstallprompt，可以给一个真按钮
            var deferred = null;
            var hint = document.getElementById('installHint');
            var btn = document.getElementById('installBtn');
            var text = document.getElementById('installHintText');

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferred = e;
                if (localStorage.getItem('pwaHintDismissed') === '1') return;
                hint.classList.add('show');
            });

            if (btn) {
                btn.addEventListener('click', function () {
                    if (!deferred) { hint.classList.remove('show'); return; }
                    deferred.prompt();
                    deferred.userChoice.then(function () {
                        deferred = null;
                        hint.classList.remove('show');
                        localStorage.setItem('pwaHintDismissed', '1');
                    });
                });
            }

            // iOS Safari 没有 beforeinstallprompt：只能给文字指引，别假装有按钮
            var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            var standalone = window.navigator.standalone === true;
            var isWeChat = /micromessenger/i.test(navigator.userAgent);
            if (isIOS && !standalone && !isWeChat && localStorage.getItem('pwaHintDismissed') !== '1') {
                text.textContent = '点底部「分享」→「添加到主屏幕」';
                btn.textContent = '知道了';
                btn.addEventListener('click', function () {
                    hint.classList.remove('show');
                    localStorage.setItem('pwaHintDismissed', '1');
                });
                setTimeout(function () { hint.classList.add('show'); }, 1200);
            }
        })();
    </script>
</th:block>
</body>
</html>

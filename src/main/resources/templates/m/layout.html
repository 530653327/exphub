<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  移动端公共壳（2026-11-08 起，2026-11-17 换成 daisyUI 体系）。

  三件事只在这里做：
    1. 视口/安全区/PWA 元信息 —— 每页各写一遍迟早漂
    2. 底部导航 —— 五个入口固定，不加第六个（加了就要重排整个底栏）
    3. Service Worker 注册 —— 只在移动壳注册，PC 后台不注册，免得缓存互相干扰

  样式来源（2026-11-17 改）：
    /lib/ui/app.css   编译产物（daisyUI 5 + Tailwind 4），提交进仓库，运行时不构建
    /css/mobile.css   手写补充：安全区、iOS 输入框字号、顶栏、按压反馈
  两条都走本地文件，不连 CDN —— 手机在地铁里 CDN 抖一下就是整页白屏，
  而 Thymeleaf 是边渲染边输出，白屏时 HTTP 还是 200，监控看不见。
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <!-- CSRF：移动端后续的写操作（删除待删文档等）要带 token，这里与 PC 的 layout/base.html 口径一致。
         _csrf 为 null 时给空串，页面照常渲染（登录页也可能没有）。 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#16161d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="经验阁">
    <meta name="format-detection" content="telephone=no">
    <title th:text="${title} + ' · 经验阁'">经验阁</title>
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="apple-touch-icon" th:href="@{/images/pwa/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/pwa/favicon-32.png}">

    <!-- 主题必须在 CSS 之前定好，否则浅色用户会先看到一帧深色再跳过来。
         规则：没手动选过 → 6:00–18:00 浅色（explight），其余深色（exp）；
         在「我的 → 外观」选过就固定，选「自动」清掉手动选择。
         ⚠️ 时段边界与 PC 的 /js/theme.js 是同一份，两处一起改
         （ThemeAutoSwitchTest 会比对两边的 6 / 18）。 -->
    <script th:inline="javascript">
        (function () {
            var KEY = 'exphub-theme';

            function pick() {
                var t = null;
                try { t = localStorage.getItem(KEY); } catch (e) { /* 隐私模式禁用 localStorage */ }
                if (t === 'exp' || t === 'explight') return t;
                var h = new Date().getHours();
                return (h >= 6 && h < 18) ? 'explight' : 'exp';
            }

            function apply() {
                var t = pick();
                document.documentElement.setAttribute('data-theme', t);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', t === 'explight' ? '#f5f6fa' : '#16161d');
                return t;
            }

            apply();

            // 跨时段：每分钟 + 回前台（手机后台会冻住定时器，只靠 setInterval 换不过去）
            setInterval(apply, 60 * 1000);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) apply();
            });

            /* 「我的 → 外观」用：三态 auto / exp / explight，改完立刻生效不刷新 */
            window.ExpHubMobileTheme = {
                current: function () { return document.documentElement.getAttribute('data-theme'); },
                isManual: function () {
                    try {
                        var t = localStorage.getItem(KEY);
                        return t === 'exp' || t === 'explight';
                    } catch (e) { return false; }
                },
                set: function (t) {
                    try {
                        if (t === 'auto') localStorage.removeItem(KEY);
                        else if (t === 'exp' || t === 'explight') localStorage.setItem(KEY, t);
                    } catch (e) { /* 存不了就只本次生效 */ }
                    return apply();
                }
            };
        })();
    </script>

    <link rel="stylesheet" th:href="@{/lib/ui/app.css}">
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body class="bg-base-100 text-base-content">

<!-- 底部导航：五项固定。activeTab 传 dashboard / pending / dispatch / users / me
     2026-11-08 加了第 5 项「用户」（越哥要求能看到用户数与用户信息）。
     2026-11-17 第三项「埋点」下线，换成「派单」—— 手机上要看单、要审单、要验收，
     而工具埋点是看数用的，PC 端 /tool-stats 更合适。
     五个是手机底部栏的上限 —— 再加就要么改抽屉，要么把「我的」挪进头像入口，
     别直接塞第六个，360px 宽的手机上每个 Tab 只剩 60px，字会挤成一团。

     用的是 daisyUI 的 dock 组件（不是自己排 flex）：它自带格子的图标/文字间距、
     选中态和 1px 分隔，手写那版在 360px 上第三项总是差 2px 对不齐。 -->
<nav class="dock" th:fragment="tabbar(activeTab)">
    <a class="tab" th:classappend="${activeTab == 'dashboard'} ? 'dock-active'" th:href="@{/m/dashboard}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg>
        <span class="dock-label">看板</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'pending'} ? 'dock-active'" th:href="@{/m/pending}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg>
        <span class="dock-label">待删</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'dispatch'} ? 'dock-active'" th:href="@{/m/dispatch}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        <span class="dock-label">派单</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'users'} ? 'dock-active'" th:href="@{/m/users}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19.5c1-3 3.3-4.6 6.2-4.6s5.2 1.6 6.2 4.6"/><path d="M16.5 5.6a3 3 0 0 1 0 5.8M17.6 14.4c2.1.5 3.5 2.2 4 4.4"/></svg>
        <span class="dock-label">用户</span>
    </a>
    <a class="tab" th:classappend="${activeTab == 'me'} ? 'dock-active'" th:href="@{/m/me}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4S18.3 16.4 19.5 20"/></svg>
        <span class="dock-label">我的</span>
    </a>
</nav>

<!-- PWA 注册 + 安装引导：只在移动壳里跑 -->
<th:block th:fragment="pwa">
    <div class="install-hint" id="installHint">
        <div class="flex items-center gap-3">
            <div class="flex-1 min-w-0">
                <div class="text-sm font-medium">装到桌面更好用</div>
                <div class="text-xs opacity-60 mt-0.5" id="installHintText">点下方按钮添加到主屏幕，像一个 App 一样打开</div>
            </div>
            <button class="btn btn-primary btn-sm" id="installBtn">安装</button>
        </div>
    </div>
    <script th:inline="javascript">
        (function () {
            // 2026-11-08 修正（这是本页第一次上线就白屏的根因）：
            // 原来用 servlet 请求对象取 contextPath，它在 Thymeleaf 3.1 下求值为 null，
            // 对 null 取属性直接抛 TemplateProcessingException。而 HTML 是边渲染边输出的，
            // 异常发生时响应已提交 —— 错误页渲染不出来，浏览器只收到半截 HTML，
            // 表现就是「深灰背景、什么都没有」，而且 HTTP 还是 200，监控完全看不见。
            // 改用 @{/}：contextPath 由 Thymeleaf 自己拼，不依赖 model 属性、也不依赖 request 对象。
            var ctx = /*[[@{/}]]*/ '/';
            ctx = ctx.replace(/\/$/, '');
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register(ctx + '/sw.js').catch(function (e) {
                        // 注册失败不影响使用，但要在控制台留痕，否则「为什么装不上」无从查起
                        console.warn('SW 注册失败', e);
                    });
                });
            }

            // Android/Chrome：支持 beforeinstallprompt，可以给一个真按钮
            var deferred = null;
            var hint = document.getElementById('installHint');
            var btn = document.getElementById('installBtn');
            var text = document.getElementById('installHintText');

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferred = e;
                if (localStorage.getItem('pwaHintDismissed') === '1') return;
                hint.classList.add('show');
            });

            if (btn) {
                btn.addEventListener('click', function () {
                    if (!deferred) { hint.classList.remove('show'); return; }
                    deferred.prompt();
                    deferred.userChoice.then(function () {
                        deferred = null;
                        hint.classList.remove('show');
                        localStorage.setItem('pwaHintDismissed', '1');
                    });
                });
            }

            // iOS Safari 没有 beforeinstallprompt：只能给文字指引，别假装有按钮
            var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            var standalone = window.navigator.standalone === true;
            var isWeChat = /micromessenger/i.test(navigator.userAgent);
            if (isIOS && !standalone && !isWeChat && localStorage.getItem('pwaHintDismissed') !== '1') {
                text.textContent = '点底部「分享」→「添加到主屏幕」';
                btn.textContent = '知道了';
                btn.addEventListener('click', function () {
                    hint.classList.remove('show');
                    localStorage.setItem('pwaHintDismissed', '1');
                });
                setTimeout(function () { hint.classList.add('show'); }, 1200);
            }
        })();
    </script>
</th:block>
</body>
</html>

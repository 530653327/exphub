<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('看板')}"></head>
<body class="bg-base-100 text-base-content">
<div class="page">

    <header class="app-bar -mx-4 -mt-3 mb-3 px-4">
        <div class="flex-1 min-w-0">
            <h1>看板</h1>
            <div class="text-xs opacity-50 mt-0.5" th:text="'你好，' + ${me}">你好</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-circle" id="refreshBtn" aria-label="刷新">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
    </header>

    <div id="loading" class="flex flex-col items-center gap-3 py-16 opacity-50">
        <span class="loading loading-spinner loading-md"></span>
        <span class="text-sm">加载中…</span>
    </div>

    <div id="content" class="hidden">

        <!-- 第一张卡：一次调用。手机屏幕就这么高，先把「今天有没有人用」放最大，
             其余三项缩成一行小格，一眼扫完不用滚动。 -->
        <div class="card bg-base-200 shadow-sm mb-3">
            <div class="card-body p-4">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="text-xs opacity-55">今日调用</div>
                        <div class="text-[34px] font-semibold tnum leading-none mt-1.5" id="m-todayCalls">—</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs opacity-55">成功率</div>
                        <div class="text-lg font-semibold tnum mt-1" id="m-successRate">—</div>
                        <div class="text-[11px] opacity-40 mt-0.5" id="m-sample">—</div>
                    </div>
                </div>
                <div class="text-xs opacity-50 mt-2.5" id="m-callsSub">—</div>
            </div>
        </div>

        <!-- 三项小格：两列变一行三列，省下的 60px 正好让「问题文档」进首屏 -->
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">知识文档</div>
                    <div class="text-xl font-semibold tnum" id="m-totalDocs">—</div>
                    <div class="text-[10px] opacity-40 truncate" id="m-docsSub">—</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">活跃助手</div>
                    <div class="text-xl font-semibold tnum" id="m-totalAssistants">—</div>
                    <div class="text-[10px] opacity-40">在用且非空壳</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3 gap-0.5">
                    <div class="text-[11px] opacity-55">项目</div>
                    <div class="text-xl font-semibold tnum" id="m-totalProjects">—</div>
                    <div class="text-[10px] opacity-40 truncate" id="m-projectDocs">—</div>
                </div>
            </div>
        </div>

        <div class="text-xs font-medium opacity-55 px-1 mb-2">质量与风险</div>

        <!-- 风险四项，全部可点。原来只有「问题文档」能点，剩下的死数字点了没反应，
             手机上人会以为是加载失败 -->
        <div class="grid grid-cols-2 gap-2">
            <a class="card bg-base-200 shadow-sm tap" th:href="@{/m/problems}">
                <div class="card-body p-3.5 gap-0.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] opacity-55">问题文档</span>
                        <svg class="w-3.5 h-3.5 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
                    </div>
                    <div class="text-2xl font-semibold tnum text-warning" id="m-problemDocs">—</div>
                    <div class="text-[10px] opacity-40">超期/取代/待删/异常</div>
                </div>
            </a>
            <a class="card bg-base-200 shadow-sm tap" th:href="@{/m/problems(type='stale')}">
                <div class="card-body p-3.5 gap-0.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] opacity-55">超 90 天未验证</span>
                        <svg class="w-3.5 h-3.5 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
                    </div>
                    <div class="text-2xl font-semibold tnum text-warning" id="m-staleDocs">—</div>
                    <div class="text-[10px] opacity-40">结论可能已过期</div>
                </div>
            </a>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3.5 gap-0.5">
                    <div class="text-[11px] opacity-55">待判候选</div>
                    <div class="text-2xl font-semibold tnum" id="m-candidatePending">—</div>
                    <div class="text-[10px] opacity-40">疑似重复待人工定</div>
                </div>
            </div>
            <div class="card bg-base-200 shadow-sm">
                <div class="card-body p-3.5 gap-0.5">
                    <div class="text-[11px] opacity-55">搜索零命中</div>
                    <div class="text-2xl font-semibold tnum" id="m-searchZeroRate">—</div>
                    <div class="text-[10px] opacity-40 truncate" id="m-searchSub">近 30 天</div>
                </div>
            </div>
        </div>

        <div class="text-xs font-medium opacity-55 px-1 mt-5 mb-2">近 7 天调用</div>
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-3">
                <svg id="trend" viewBox="0 0 320 110" preserveAspectRatio="none"
                     class="w-full h-[110px] block"></svg>
                <div class="text-[11px] opacity-45 mt-1" id="trendSub">—</div>
            </div>
        </div>

        <div class="text-xs font-medium opacity-55 px-1 mt-5 mb-2">全局 / 项目分布</div>
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-0">
                <div class="flex items-center justify-between px-4 py-3">
                    <span class="text-sm opacity-60">全局知识文档</span>
                    <span class="text-sm font-medium tnum" id="m-globalDocs">—</span>
                </div>
                <div class="h-px bg-base-300 mx-4"></div>
                <div class="flex items-center justify-between px-4 py-3">
                    <span class="text-sm opacity-60">项目内文档</span>
                    <span class="text-sm font-medium tnum" id="m-projectDocs2">—</span>
                </div>
            </div>
        </div>

        <div class="text-xs font-medium opacity-55 px-1 mt-5 mb-2">热门经验 Top10</div>
        <div id="hotList" class="flex flex-col gap-2"></div>

        <div class="text-center text-[11px] opacity-30 mt-6 mb-2" id="updatedAt"></div>
    </div>
</div>

<nav th:replace="~{m/layout :: tabbar('dashboard')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>

<script th:inline="javascript">
    // 用 @{/} 取 contextPath，不碰 servlet 请求对象（本项目 Thymeleaf 3.1 下它为 null，会炸模板）
    var CTX = /*[[@{/}]]*/ '/';
    CTX = CTX.replace(/\/$/, '');

    function num(v, digits) {
        if (v === null || v === undefined || v === '') return '0';
        var n = Number(v);
        if (isNaN(n)) return String(v);
        return digits === undefined ? n.toLocaleString('zh-CN') : n.toFixed(digits);
    }

    function setText(id, text) {
        var el = document.getElementById(id);
        if (el) el.textContent = text;
    }

    function load() {
        var loading = document.getElementById('loading');
        var content = document.getElementById('content');
        loading.classList.remove('hidden');
        content.classList.add('hidden');

        Promise.all([
            fetch(CTX + '/api/stats/overview').then(function (r) { return r.json(); }),
            fetch(CTX + '/api/stats/call-trend?days=7').then(function (r) { return r.json(); }),
            fetch(CTX + '/api/stats/hot-docs?limit=10').then(function (r) { return r.json(); })
        ]).then(function (res) {
            var o = (res[0] && res[0].data) || {};
            renderOverview(o);
            renderTrend((res[1] && res[1].data) || []);
            renderHot((res[2] && res[2].data) || []);
            setText('updatedAt', '数据更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
            loading.classList.add('hidden');
            content.classList.remove('hidden');
        }).catch(function (e) {
            // 失败也要从「加载中」里出来，否则用户不知道是网络慢还是真挂了
            loading.innerHTML = '<div class="text-error text-sm px-4 text-center">加载失败：'
                + escapeHtml(e.message) + '<br><span class="opacity-50">下拉或点右上角刷新重试</span></div>';
        });
    }

    function renderOverview(o) {
        setText('m-totalDocs', num(o.totalDocs));
        setText('m-docsSub', '全局 ' + num(o.globalDocs) + ' · 项目 ' + num(o.projectDocs));
        setText('m-todayCalls', num(o.todayCalls));
        setText('m-callsSub', '业务 ' + num(o.todayBiz) + ' · 工具 ' + num(o.todayTool));
        setText('m-totalAssistants', num(o.totalAssistants));

        var rate = o.successRate;
        // successRate 在不同口径下可能是 0~1 小数，也可能是已乘 100 的字符串 —— 两种都要认
        var pct = rate === undefined || rate === null ? null : (Number(rate) > 1 ? Number(rate) : Number(rate) * 100);
        setText('m-successRate', pct === null || isNaN(pct) ? '—' : pct.toFixed(1) + '%');
        setText('m-sample', o.successSampled ? '样本 ' + num(o.successSampled) : '样本积累中');

        setText('m-problemDocs', num(o.problemDocs));
        setText('m-staleDocs', num(o.staleDocs));
        setText('m-candidatePending', num(o.candidatePending));

        var zr = o.searchZeroRate;
        setText('m-searchZeroRate', zr === undefined || zr === null ? '—' : num(zr, 1) + '%');
        setText('m-searchSub', '近 30 天 · 共 ' + num(o.searchTotal) + ' 次搜索');

        setText('m-globalDocs', num(o.globalDocs));
        setText('m-projectDocs', '文档 ' + num(o.projectDocs));
        setText('m-projectDocs2', num(o.projectDocs));
        setText('m-totalProjects', num(o.totalProjects));
    }

    function renderTrend(rows) {
        var svg = document.getElementById('trend');
        if (!rows || !rows.length) {
            svg.innerHTML = '';
            setText('trendSub', '暂无调用记录');
            return;
        }
        var vals = rows.map(function (r) {
            return Number(r.bizCalls !== undefined ? r.bizCalls : (r.calls !== undefined ? r.calls : 0));
        });
        var max = Math.max.apply(null, vals.concat([1]));
        var W = 320, H = 110, pad = 6;
        var step = rows.length > 1 ? (W - pad * 2) / (rows.length - 1) : 0;

        var pts = vals.map(function (v, i) {
            var x = pad + step * i;
            var y = H - pad - (v / max) * (H - pad * 2);
            return [x, y];
        });

        var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
        var area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - pad) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - pad) + ' Z';

        var dots = pts.map(function (p) {
            return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.4" fill="#6366f1"/>';
        }).join('');

        svg.innerHTML =
            '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#6366f1" stop-opacity="0.38"/>' +
            '<stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>' +
            '</linearGradient></defs>' +
            '<path d="' + area + '" fill="url(#g)"/>' +
            '<path d="' + line + '" fill="none" stroke="#6366f1" stroke-width="2" ' +
            'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
            dots;

        var total = vals.reduce(function (a, b) { return a + b; }, 0);
        setText('trendSub', '共 ' + total.toLocaleString('zh-CN') + ' 次 · 峰值 ' + max.toLocaleString('zh-CN'));
    }

    function renderHot(list) {
        var box = document.getElementById('hotList');
        if (!list || !list.length) {
            box.innerHTML = '<div class="text-center text-sm opacity-40 py-10">暂无数据</div>';
            return;
        }
        box.innerHTML = list.map(function (d, i) {
            var rate = d.successRate === undefined || d.successRate === null ? null : Number(d.successRate) * 100;
            // 前三名给个色，十行一模一样的卡片扫不出重点
            var rankCls = i === 0 ? 'bg-primary text-primary-content'
                : i === 1 ? 'bg-primary/70 text-primary-content'
                : i === 2 ? 'bg-primary/40' : 'bg-base-300 opacity-60';
            return '<div class="card bg-base-200 shadow-sm">' +
                '<div class="card-body p-3 flex-row items-center gap-3">' +
                '<div class="w-6 h-6 rounded-lg text-[11px] font-semibold flex items-center justify-center shrink-0 ' + rankCls + '">' + (i + 1) + '</div>' +
                '<div class="flex-1 min-w-0">' +
                '<div class="text-sm font-medium truncate">' + escapeHtml(d.title || '') + '</div>' +
                '<div class="text-[11px] opacity-45 truncate mt-0.5">' + escapeHtml(d.authorName || '—') +
                ' · 查看 ' + num(d.callCount) +
                (rate === null || isNaN(rate) ? '' : ' · 成功 ' + rate.toFixed(0) + '%') +
                '</div></div></div></div>';
        }).join('');
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
</script>
</body>
</html>

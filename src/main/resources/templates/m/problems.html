<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('问题文档')}"></head>
<body class="bg-base-100 text-base-content">
<div class="page">

    <header class="app-bar -mx-4 -mt-3 mb-3 px-4">
        <a class="btn btn-ghost btn-sm btn-circle" th:href="@{/m/dashboard}" aria-label="返回">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </a>
        <div class="flex-1 min-w-0">
            <h1>问题文档</h1>
            <div class="text-xs opacity-50 mt-0.5 truncate" id="subtitle">加载中…</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-circle" id="refreshBtn" aria-label="刷新">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
    </header>

    <!-- 5 个分类横向滚动：360px 宽放不下 5 个 chip，竖着换行会把列表挤到第二屏以后 -->
    <div class="hscroll flex gap-2 mb-2 -mx-4 px-4" id="typeBar">
        <!-- chip 由 JS 渲染，计数来自接口 -->
    </div>

    <div class="text-xs opacity-45 px-1 mb-3 leading-relaxed" id="typeHint">—</div>

    <div role="alert" class="alert alert-error mb-3 items-start" id="errBox" style="display:none">
        <div class="flex-1 min-w-0">
            <div class="font-medium">加载失败</div>
            <div class="text-sm opacity-85 mt-1 pre-wrap" id="errMsg"></div>
            <button class="btn btn-sm btn-ghost mt-2.5" id="retryBtn">重试</button>
        </div>
    </div>

    <div id="list" class="flex flex-col gap-2"></div>
    <div id="hint" class="text-center text-xs opacity-40 py-4" style="display:none"></div>
    <div id="sentinel" style="height:1px"></div>
</div>

<nav th:replace="~{m/layout :: tabbar('dashboard')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>

<script th:inline="javascript">
    // contextPath 用 @{/}（不要用 servlet 请求对象，Thymeleaf 3.1 下为 null 会炸模板）
    var CTX = /*[[@{/}]]*/ '/';
    CTX = CTX.replace(/\/$/, '');

    // 与 DocService 的 5 个常量一一对应。顺序按「最该先处理」排：
    // 待删和已失效是明确的坏数据，超期未验证只是一段时间没确认，优先级低一些。
    var TYPES = [
        { k: 'pending_delete', name: '待删', hint: 'AI 标了待删，等你确认后才会真删', countKey: 'PENDING_DELETE' },
        { k: 'broken', name: '已失效', hint: '状态被置为已失效，正文不可用', countKey: 'BROKEN' },
        { k: 'superseded', name: '被取代', hint: '已有新版本指向它，旧结论可能误导人', countKey: 'SUPERSEDED' },
        { k: 'flagged', name: '被打标记', hint: '被标过重复 / 低质 / 需复核', countKey: 'FLAGGED' },
        { k: 'stale', name: '超期未验证', hint: '正常状态，但很久没人确认它还成立', countKey: 'STALE' }
    ];

    var curType = 'stale';
    var page = 1, pages = 1, loading = false, total = 0;
    var counts = {};
    var staleDays = 90;
    var expanded = {};

    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
    }

    function num(v) {
        if (v === null || v === undefined || v === '') return '0';
        var n = Number(v);
        return isNaN(n) ? String(v) : n.toLocaleString('zh-CN');
    }

    function fmtDate(s, emptyText) {
        if (!s) return emptyText || '—';
        var t = String(s).replace('T', ' ');
        return t.length >= 10 ? t.substring(0, 10) : t;
    }

    function setText(id, t) {
        var el = document.getElementById(id);
        if (el) el.textContent = t;
    }

    function showError(msg) {
        setText('errMsg', msg);
        document.getElementById('errBox').style.display = 'flex';
        setText('subtitle', '加载失败');
    }

    function renderTypes() {
        var bar = document.getElementById('typeBar');
        bar.innerHTML = TYPES.map(function (t) {
            var active = t.k === curType;
            // 选中态用 btn-primary：五个 chip 并排，只靠灰色深浅分不出选中的是哪个
            return '<button class="btn btn-sm shrink-0' + (active ? ' btn-primary' : ' btn-ghost bg-base-200')
                + '" data-type="' + t.k + '">'
                + t.name + ' <span class="tnum opacity-70">' + num(counts[t.countKey]) + '</span>'
                + '</button>';
        }).join('');

        bar.querySelectorAll('[data-type]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var t = btn.getAttribute('data-type');
                if (t === curType) return;
                curType = t;
                renderTypes();
                load(true);
            });
        });

        var meta = TYPES.filter(function (t) { return t.k === curType; })[0];
        setText('typeHint', meta ? meta.hint : '');
    }

    /** 每类问题要摊开的信息不同：看「超期」时最想知道上次验证是什么时候，看「被取代」时最想知道指向谁 */
    function extraHtml(d) {
        if (curType === 'stale') {
            return '<div class="text-[11px] opacity-55 mt-1.5 tnum">'
                + (d.lastVerifiedAt
                    ? '最后验证 ' + fmtDate(d.lastVerifiedAt)
                    : '<span class="text-warning font-medium">从未验证过</span>')
                + ' · 最后修改 ' + fmtDate(d.updatedAt)
                + '</div>';
        }
        if (curType === 'superseded') {
            return '<div class="text-[11px] opacity-55 mt-1.5">已被 #' + esc(d.supersededBy) + ' 取代</div>';
        }
        if (curType === 'flagged') {
            return '<div class="rounded-xl bg-warning/10 border border-warning/25 px-3 py-2 mt-2.5">'
                + '<div class="text-[11px] opacity-50 mb-0.5">标记</div>'
                + '<div class="text-[13px] leading-relaxed">' + esc(d.flags || '—') + '</div></div>';
        }
        if (curType === 'pending_delete') {
            return '<div class="rounded-xl bg-error/10 border border-error/25 px-3 py-2 mt-2.5">'
                + '<div class="text-[11px] opacity-50 mb-0.5">待删原因</div>'
                + '<div class="text-[13px] leading-relaxed">' + esc(d.deleteReason || '（标记时未写原因）') + '</div></div>';
        }
        return '';
    }

    function cardHtml(d) {
        var badges = [];
        if (d.status === 'BROKEN') badges.push('<span class="badge badge-error badge-sm badge-soft shrink-0">已失效</span>');
        else if (d.status === 'PENDING_DELETE') badges.push('<span class="badge badge-warning badge-sm badge-soft shrink-0">待删</span>');
        else if (d.supersededBy) badges.push('<span class="badge badge-warning badge-sm badge-soft shrink-0">被取代</span>');

        return '<div class="card bg-base-200 shadow-sm" data-id="' + d.id + '">'
            + '<div class="card-body p-3.5 gap-0">'
            + '<div class="flex items-start gap-2">'
            + '<div class="flex-1 min-w-0 text-[15px] font-semibold leading-snug">' + esc(d.title || '（无标题）') + '</div>'
            + badges.join('')
            + '</div>'
            + '<div class="text-[11px] opacity-45 mt-1 tnum">#'
            + d.id + ' · ' + esc(d.category || '未分类')
            + ' · ' + esc(d.authorName || '—')
            + ' · ' + num(d.contentLength) + ' 字</div>'
            + (d.summary ? '<div class="text-sm opacity-65 mt-2 line-clamp-2 leading-relaxed">' + esc(d.summary) + '</div>' : '')
            + extraHtml(d)
            + '<div id="body-' + d.id + '" style="display:none" class="mt-3 pt-3 border-t border-base-300">'
            + '<div class="pre-wrap text-sm leading-relaxed"></div></div>'
            + '<button class="btn btn-ghost btn-sm mt-3 self-start" data-act="view" data-id="' + d.id + '">看正文</button>'
            + '</div></div>';
    }

    function getJson(url) {
        return fetch(url, { credentials: 'same-origin' }).then(function (r) {
            if (r.status === 401 || r.status === 403) throw new Error('登录已过期，请重新登录（HTTP ' + r.status + '）');
            if (!r.ok) throw new Error('服务端返回 HTTP ' + r.status);
            return r.json();
        }).then(function (res) {
            if (res.code !== 0) throw new Error(res.message || '接口返回失败');
            return res.data;
        });
    }

    function load(reset) {
        if (loading) return;
        loading = true;
        document.getElementById('errBox').style.display = 'none';

        if (reset) {
            page = 1;
            pages = 1;
            document.getElementById('list').innerHTML =
                '<div class="flex justify-center py-10"><span class="loading loading-spinner loading-md opacity-50"></span></div>';
        }

        getJson(CTX + '/api/docs/problems?type=' + curType + '&page=' + page + '&size=20')
            .then(function (d) {
                counts = d.counts || {};
                staleDays = d.staleDays || 90;
                pages = d.pages || 1;
                total = d.total || 0;

                // 计数变了要重画 chip（否则第一次进来数字全是 0）
                renderTypes();

                var rows = d.list || [];
                if (reset) document.getElementById('list').innerHTML = '';
                if (rows.length) {
                    document.getElementById('list').insertAdjacentHTML('beforeend', rows.map(cardHtml).join(''));
                } else if (page === 1) {
                    document.getElementById('list').innerHTML =
                        '<div class="flex flex-col items-center gap-1 py-14 opacity-45">'
                        + '<svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m5 13 4 4L19 7"/></svg>'
                        + '<div class="text-sm font-medium mt-1">这一类的没有问题文档</div></div>';
                }

                setText('subtitle', total ? total + ' 条 · 第 ' + page + '/' + pages + ' 页' : '这一类干净');

                var hint = document.getElementById('hint');
                if (page < pages) {
                    hint.style.display = 'block';
                    hint.textContent = '继续下滑加载更多…';
                } else {
                    hint.style.display = 'none';
                }
            })
            .catch(function (e) {
                showError(e.message || String(e));
                if (reset) document.getElementById('list').innerHTML = '';
            })
            .then(function () {
                loading = false;
            });
    }

    function toggleBody(id, btn) {
        var box = document.getElementById('body-' + id);
        if (expanded[id]) {
            var open = box.style.display !== 'none';
            box.style.display = open ? 'none' : 'block';
            btn.textContent = open ? '看正文' : '收起';
            return;
        }
        btn.textContent = '加载中…';
        btn.disabled = true;

        getJson(CTX + '/api/docs/' + id).then(function (d) {
            box.querySelector('div').textContent = (d && d.content) || '（正文为空）';
            box.style.display = 'block';
            expanded[id] = true;
            btn.textContent = '收起';
        }).catch(function (e) {
            btn.textContent = '看正文';
            showError('读正文失败：' + (e.message || e));
        }).then(function () {
            btn.disabled = false;
        });
    }

    document.getElementById('list').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-act="view"]');
        if (!btn) return;
        toggleBody(btn.getAttribute('data-id'), btn);
    });

    document.getElementById('refreshBtn').addEventListener('click', function () { load(true); });
    document.getElementById('retryBtn').addEventListener('click', function () { load(true); });

    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            if (!entries[0].isIntersecting) return;
            if (loading || page >= pages) return;
            page += 1;
            load(false);
        }, { rootMargin: '200px' }).observe(document.getElementById('sentinel'));
    }

    renderTypes();
    load(true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{m/layout :: head('我的')}"></head>
<body class="bg-base-100 text-base-content">
<div class="page">

    <header class="app-bar -mx-4 -mt-3 mb-3 px-4">
        <div class="flex-1 min-w-0"><h1>我的</h1></div>
    </header>

    <div class="card bg-base-200 shadow-sm mb-4">
        <div class="card-body p-4 gap-0">
            <div class="flex items-center gap-3">
                <img th:src="@{/images/pwa/icon-192.png}" alt=""
                     class="w-12 h-12 rounded-xl shrink-0">
                <div class="flex-1 min-w-0">
                    <div class="text-[15px] font-semibold truncate" th:text="${me}">用户名</div>
                    <div class="text-xs opacity-50 mt-0.5 truncate" th:text="'账号 ' + ${username}">账号</div>
                </div>
            </div>
            <div class="h-px bg-base-300 my-3"></div>
            <div class="flex items-center justify-between">
                <span class="text-sm opacity-60">最近登录</span>
                <span class="text-sm tnum" th:text="${lastLogin}">—</span>
            </div>
        </div>
    </div>

    <div class="text-xs font-medium opacity-55 px-1 mb-2">外观</div>
    <div class="card bg-base-200 shadow-sm mb-4">
        <div class="card-body p-3 gap-0">
            <!-- 主题三档：自动 / 深 / 浅。自动 = 按时间（6:00–18:00 浅色），规则在 m/layout.html；
                 不跟随系统 —— PWA 里系统深色与「我晚上想用浅色」经常打架，固定时段可预期。 -->
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-sm font-medium">主题</div>
                    <div class="text-xs opacity-45 mt-0.5">自动按时间切；手动点过就固定</div>
                </div>
                <div class="flex gap-1.5">
                    <button class="btn btn-sm btn-circle theme-swatch" data-theme-pick="auto" aria-pressed="false" aria-label="自动">
                        <span class="w-3.5 h-3.5 rounded-full border border-base-300"
                              style="background: linear-gradient(135deg, #1e1e27 0 50%, #ffffff 50% 100%);"></span>
                    </button>
                    <button class="btn btn-sm btn-circle theme-swatch" data-theme-pick="exp" aria-pressed="true" aria-label="深色">
                        <span class="w-3.5 h-3.5 rounded-full bg-neutral-800 border border-base-300"></span>
                    </button>
                    <button class="btn btn-sm btn-circle theme-swatch" data-theme-pick="explight" aria-pressed="false" aria-label="浅色">
                        <span class="w-3.5 h-3.5 rounded-full bg-white border border-base-300"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="text-xs font-medium opacity-55 px-1 mb-2">安装</div>
    <div class="card bg-base-200 shadow-sm mb-4">
        <div class="card-body p-4 gap-0">
            <div class="text-sm" id="installState">检测中…</div>
            <div class="h-px bg-base-300 my-3"></div>
            <div class="text-xs opacity-50 leading-relaxed">
                · iOS：Safari 打开 → 分享 → 添加到主屏幕<br>
                · 安卓：Chrome 打开 → 菜单 → 安装应用<br>
                · 微信内置浏览器不支持安装，请用系统浏览器
            </div>
        </div>
    </div>

    <div class="text-xs font-medium opacity-55 px-1 mb-2">关于</div>
    <div class="card bg-base-200 shadow-sm mb-4">
        <div class="card-body p-0">
            <div class="flex items-center justify-between px-4 py-3">
                <span class="text-sm opacity-60">版本</span>
                <span class="text-sm tnum" th:text="${version} ?: 'dev'">dev</span>
            </div>
            <div class="h-px bg-base-300 mx-4"></div>
            <div class="flex items-center justify-between px-4 py-3">
                <span class="text-sm opacity-60">知识文档</span>
                <a class="text-sm link link-hover tnum" th:href="@{/m/problems}">问题文档 ›</a>
            </div>
        </div>
    </div>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline btn-error w-full" type="submit">退出登录</button>
    </form>

    <div class="text-center text-[11px] opacity-30 mt-6 leading-relaxed">
        经验阁 · 移动版<br>
        手机上只做查看与处理，新增和编辑请在电脑上完成
    </div>
</div>

<nav th:replace="~{m/layout :: tabbar('me')}"></nav>
<th:block th:replace="~{m/layout :: pwa}"></th:block>

<script th:inline="javascript">
    (function () {
        var el = document.getElementById('installState');
        var standalone = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        var isWeChat = /micromessenger/i.test(navigator.userAgent);

        if (standalone) {
            el.textContent = '已以独立应用方式打开';
            el.classList.add('text-success');
        } else if (isWeChat) {
            el.textContent = '当前在微信内打开，无法安装。用系统浏览器打开后可添加到主屏幕';
        } else if (!('serviceWorker' in navigator)) {
            el.textContent = '当前浏览器不支持 PWA，功能不受影响';
        } else {
            el.textContent = '尚未安装到主屏幕，按下方说明添加后体验更好';
        }

        // 主题切换：三档（自动 / 深 / 浅），写 localStorage + 立刻改 data-theme，不刷新页面
        // （刷新会丢滚动位置，在建列表里滑到一半跳回顶部很难受）
        // 逻辑在 m/layout.html 的 ExpHubMobileTheme：自动档清掉手动选择，按 6:00–18:00 切
        function syncSwatches() {
            var cur = window.ExpHubMobileTheme ? window.ExpHubMobileTheme.current() : 'exp';
            var manual = window.ExpHubMobileTheme ? window.ExpHubMobileTheme.isManual() : false;
            document.querySelectorAll('[data-theme-pick]').forEach(function (b) {
                var pick = b.getAttribute('data-theme-pick');
                b.setAttribute('aria-pressed', (pick === 'auto' ? !manual : (manual && pick === cur)) ? 'true' : 'false');
            });
        }
        document.querySelectorAll('[data-theme-pick]').forEach(function (b) {
            b.addEventListener('click', function () {
                var pick = b.getAttribute('data-theme-pick');
                if (window.ExpHubMobileTheme) window.ExpHubMobileTheme.set(pick);
                else document.documentElement.setAttribute('data-theme', pick === 'auto' ? 'exp' : pick);
                syncSwatches();
            });
        });
        syncSwatches();
    })();
</script>
</body>
</html>

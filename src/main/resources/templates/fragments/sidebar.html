<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  后台左侧菜单 —— 唯一来源（2026-11-16）。

  为什么抽出来：原来 17 个模板各写一份，条目、顺序、名称全不一样，
  点来点去菜单就「少了几项」或「顺序变了」，而且除了派单自己的页面，
  别的页面根本没有「派单」入口，进去就出不来。

  改菜单只改这里。调用：<div th:replace="~{fragments/sidebar :: nav('docs')}"></div>
  参数 active 取：dashboard / docs / projects / dispatch / assistants / logs / tool-stats / templates / profile
-->
<div th:fragment="nav(active)" class="sidebar">
    <div class="brand">经验<span>阁</span> ExpHub</div>
    <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
        <i class="fas fa-chart-line mr-2"></i> 仪表盘</a>
    <a th:href="@{/docs}" th:classappend="${active == 'docs'} ? 'active'">
        <i class="fas fa-book-open mr-2"></i> 经验管理</a>
    <a th:href="@{/projects}" th:classappend="${active == 'projects'} ? 'active'">
        <i class="fas fa-folder-open mr-2"></i> 项目管理</a>
    <a th:href="@{/dispatch}" th:classappend="${active == 'dispatch'} ? 'active'">
        <i class="fas fa-paper-plane mr-2"></i> 派单</a>
    <a th:href="@{/assistants}" th:classappend="${active == 'assistants'} ? 'active'">
        <i class="fas fa-key mr-2"></i> 秘钥管理</a>
    <a th:href="@{/logs}" th:classappend="${active == 'logs'} ? 'active'">
        <i class="fas fa-history mr-2"></i> 调用日志</a>
    <a th:href="@{/tool-stats}" th:classappend="${active == 'tool-stats'} ? 'active'">
        <i class="fas fa-tools mr-2"></i> 工具统计</a>
    <a th:href="@{/templates}" th:classappend="${active == 'templates'} ? 'active'">
        <i class="fas fa-file-alt mr-2"></i> 模板管理</a>
    <div style="margin-top: 20px; padding: 0 20px;">
        <a th:href="@{/profile/password}" th:classappend="${active == 'profile'} ? 'active'">
            <i class="fas fa-lock mr-2"></i> 修改密码</a>
    </div>
    <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 20px;">
        <a th:href="@{/logout}" class="text-white-50" style="font-size: 0.85rem;">
            <i class="fas fa-sign-out-alt mr-1"></i> 退出登录</a>
    </div>
</div>

</body>
</html>

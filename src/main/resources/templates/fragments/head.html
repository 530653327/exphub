<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============================================================================
     PC 后台公共 <head> 内容（2026-11-17 第一批统一）

     用法（页面里保留 <head> 外壳，只把公共部分换成本 fragment）：

         <head>
             <th:block th:replace="~{fragments/head :: head('仪表盘 - 经验阁 ExpHub')}"/>
             <style> /* 本页独有样式，公共的不要抄 */ </style>
         </head>

     带进来的东西：CSRF meta 两个、charset、viewport、title、favicon、
     bootstrap / fontawesome / admin.css、csrf.js。

     注意：用 th:block 而不是替换整个 <head>，这样页面还能在 head 里追加
     自己的 <style> / <script>；动态标题直接把表达式传进来，例如
     head(${order.orderNo} + ' - 派单 - 经验阁 ExpHub')。
     ========================================================================== -->

<th:block th:fragment="head(pageTitle)">
    <!-- CSRF token：供 static/js/csrf.js 全局注入 fetch / ajax 请求头 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">经验阁 ExpHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%23ffffff' font-family='system-ui,sans-serif' font-weight='bold'>E</text></svg>" type="image/svg+xml">

    <!-- 主题必须在 CSS 之前定下来，否则夜间打开会先白闪一帧（规则与 /js/theme.js 一致） -->
    <th:block th:replace="~{fragments/theme :: init}"/>

    <!-- 顺序不能动：Bootstrap 打底 → FontAwesome → admin.css（旧变量）→ pc.css（新视觉层，必须最后，
         否则盖不住 Bootstrap 的 .btn / .table / .card） -->
    <link rel="stylesheet" th:href="@{/lib/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/lib/fontawesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/pc.css}">
    <script th:src="@{/js/csrf.js}"></script>
</th:block>

</body>
</html>

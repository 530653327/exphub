<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- CSRF token：供 static/js/csrf.js 全局注入 fetch / ajax 请求头 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${doc != null ? doc.title + ' - ExpHub 分享' : '分享链接无效 - ExpHub'}">经验分享 - ExpHub</title>
    <link rel="stylesheet" th:href="@{/lib/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/lib/fontawesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/lib/github-markdown-css/github-markdown.min.css}">
    <link rel="stylesheet" th:href="@{/css/pc.css}">
    <style>
    /* 对外分享页：没有侧栏，正文是主角。头部原来是一条深蓝渐变横幅（园区大屏风），
       改成白底细线 + 品牌方块，和后台、登录页同一个形象。 */
    body {
        background: var(--bg);
    }

    .share-header {
        padding: 16px 0;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        text-align: center;
    }

    .share-header .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
    }

    .share-header .brand::before {
        content: "E";
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--brand);
        color: #fff;
        font-size: 13px;
        line-height: 24px;
        text-align: center;
    }

    .share-header .brand span {
        color: var(--brand);
    }

    .share-header .subtitle {
        margin-top: 3px;
        color: var(--text-faint);
        font-size: 12px;
    }

    .share-container {
        max-width: 860px;
        margin: 22px auto 60px;
        padding: 0 16px;
    }

    .doc-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
    }

    .doc-card .card-body {
        padding: 32px 36px 40px;
    }

    .doc-card .doc-title {
        margin-bottom: 10px;
        color: var(--text);
        font-size: 22px;
        font-weight: 680;
        line-height: 1.35;
        letter-spacing: -0.01em;
    }

    .doc-card .doc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        color: var(--text-faint);
        font-size: 12.5px;
    }

    .expire-badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: var(--radius-xs);
        font-size: 11.5px;
        font-weight: 600;
    }

    .expire-never { background: var(--ok-bg); color: var(--ok); }
    .expire-has { background: var(--warn-bg); color: var(--warn); }

    .markdown-body {
        padding-top: 6px;
        padding-bottom: 0;
        font-size: 14.5px;
        line-height: 1.85;
    }

    .error-container {
        padding: 72px 20px;
        text-align: center;
    }

    .error-container i {
        margin-bottom: 16px;
        color: var(--brand);
        font-size: 34px;
        opacity: 0.4;
    }

    .error-container h4 {
        margin-bottom: 8px;
        color: var(--text);
        font-size: 17px;
        font-weight: 620;
    }

    .error-container p {
        margin: 0;
        color: var(--text-faint);
        font-size: 13px;
    }
    </style>
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body>
    <!-- 头部 -->
    <div class="share-header">
        <div class="brand">经验<span>阁</span> ExpHub</div>
        <div class="subtitle">分享的经验文档</div>
    </div>

    <div class="share-container">
        <!-- 错误页面 -->
        <div th:if="${error != null}" class="doc-card">
            <div class="card-body error-container">
                <i class="fas fa-link"></i>
                <h4 th:text="${error}">分享链接无效</h4>
                <p>该分享链接可能已过期或已被删除，请联系分享者获取最新链接。</p>
            </div>
        </div>

        <!-- 正常文档 -->
        <div th:if="${doc != null}" class="doc-card">
            <div class="card-body">
                <div class="doc-title" th:text="${doc.title}">文档标题</div>
                <div class="doc-meta">
                    <span><i class="fas fa-user mr-1"></i><span th:text="${doc.authorName}">作者</span></span>
                    <span><i class="fas fa-folder mr-1"></i><span th:text="${doc.category ?: '未分类'}">分类</span></span>
                    <span><i class="fas fa-clock mr-1"></i><span th:text="${#temporals.format(doc.updatedAt, 'yyyy-MM-dd HH:mm')}">时间</span></span>
                    <span>
                        <i class="fas fa-hourglass-half mr-1"></i>
                        <span th:if="${share.expireAt == null}" class="expire-badge expire-never">永不过期</span>
                        <span th:if="${share.expireAt != null}" class="expire-badge expire-has">
                            到期 <span th:text="${#temporals.format(share.expireAt, 'yyyy-MM-dd')}">日期</span>
                        </span>
                    </span>
                </div>

                <!-- 标签 -->
                <div th:if="${doc.tags != null}" class="mb-3">
                    <span th:each="tag : ${#strings.listSplit(doc.tags, ',')}"
                          class="tag-color" th:text="${tag}">标签</span>
                </div>

                <!-- Markdown 内容 -->
                <div class="markdown-body" id="docContent" th:data-content="${doc.content}"></div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/jquery/jquery.min.js}"></script>
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/lib/marked/marked.min.js}"></script>
    <script>
        var content = document.getElementById('docContent');
        if (content) {
            var raw = content.getAttribute('data-content');
            if (raw) {
                content.innerHTML = marked.parse(raw);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('仪表盘 - 经验阁 ExpHub')}"/>
    <style>
    .stat-card { padding: 20px; display: flex; align-items: center; }
    .stat-card .icon { font-size: 2.5rem; margin-right: 15px; opacity: 0.8; }
    .stat-card .number { font-size: 1.8rem; }
    .stat-card .label { font-size: 0.85rem; opacity: 0.9; }
    .badge-deprecated { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: nav('dashboard')}"></div>

    <div class="main-content">
        <div class="topbar page-head">
            <div class="page-title-wrap">
                <h4 class="page-title"><i class="fas fa-chart-line"></i>仪表盘</h4>
                <div class="page-sub">近 7 天调用与热门经验</div>
            </div>
            <div class="page-actions">
                <span class="page-sub">欢迎回来，<span th:text="${currentUserName}">管理员</span></span>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card bg-gradient-primary">
                    <i class="fas fa-book-open icon"></i>
                    <div>
                        <div class="number" th:text="${totalDocs}">0</div>
                        <div class="label">经验文档（知识型）</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-success">
                    <i class="fas fa-history icon"></i>
                    <div>
                        <div class="number" th:text="${totalBiz}">0</div>
                        <div class="label">业务动作（搜索/增删改）</div>
                        <div class="small" th:text="'工具埋点 ' + ${totalTool}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-danger">
                    <i class="fas fa-bolt icon"></i>
                    <div>
                        <div class="number" th:text="${todayBiz}">0</div>
                        <div class="label">今日业务动作</div>
                        <div class="small" th:text="'工具 ' + ${todayTool}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-warning">
                    <i class="fas fa-robot icon"></i>
                    <div>
                        <div class="number" th:text="${totalAssistants}">0</div>
                        <div class="label">活跃AI助手（在用）</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stat-card" style="background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);">
                    <i class="fas fa-chart-pie icon"></i>
                    <div>
                        <div class="number" th:if="${successSampled > 0}" th:text="${successRate} + '%'">0%</div>
                        <div class="number" th:if="${successSampled == 0}">积累中</div>
                        <div class="label">业务成功率（搜索有结果+写动作成功）</div>
                        <div class="small" th:text="'工具成功率 ' + ${toolSuccessRate} + '%'">0%</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card bg-gradient-danger">
                    <i class="fas fa-exclamation-triangle icon"></i>
                    <div>
                        <div class="number" th:text="${problemDocs}">0</div>
                        <div class="label">有待处理文档（超期/取代/flag/待删/BROKEN）</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4" th:if="${problemDocs > 0}">
                <div class="stat-card" style="background: linear-gradient(135deg, #6c757d 0%, #adb5bd 100%);">
                    <i class="fas fa-clipboard-list icon"></i>
                    <div>
                        <span class="d-block small" style="font-size:0.9rem; line-height:1.6;"
                              th:text="'超期未验证 ' + ${problemDocsByType['STALE']} + ' · 被取代 ' + ${problemDocsByType['SUPERSEDED']} + ' · flag ' + ${problemDocsByType['FLAGGED']} + ' · 待删 ' + ${problemDocsByType['PENDING_DELETE']} + ' · BROKEN ' + ${problemDocsByType['BROKEN']}">-</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #6f42c1 0%, #9a67d9 100%);">
                    <i class="fas fa-folder-open icon"></i>
                    <div>
                        <div class="number" th:text="${totalProjects}">0</div>
                        <div class="label">项目空间</div>
                        <div class="small" th:text="'项目文档 ' + ${projectDocs} + ' · 全局 ' + ${globalDocs}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #f39c12 0%, #f1c40f 100%);">
                    <i class="fas fa-clock icon"></i>
                    <div>
                        <div class="number" style="color:#333;" th:text="${staleDocs}">0</div>
                        <div class="label" style="color:#333;">超期未验证（90天）</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);">
                    <i class="fas fa-tasks icon"></i>
                    <div>
                        <div class="number" th:text="${candidatePending}">0</div>
                        <div class="label">候选待判断</div>
                        <div class="small" th:text="'全部候选 ' + ${candidateTotal}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-warning">
                    <i class="fas fa-search-minus icon"></i>
                    <div>
                        <div class="number" th:text="${searchZeroRate} + '%'">0%</div>
                        <div class="label">近30天搜索零命中率</div>
                        <div class="small" th:text="'零命中 ' + ${searchZeroHit} + ' / ' + ${searchTotal}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-chart-line mr-2" style="color:var(--brand)"></i>近 7 天调用趋势</h5>
            </div>
            <div class="card-body">
                <canvas id="trendChart" height="80"></canvas>
            </div>
        </div>

        <div class="card list-card mt-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-fire mr-2" style="color:var(--brand)"></i>热门经验 Top10</h5>
                <span class="page-sub">按「详情查看次数」排序（搜索曝光自 2026-10-21 起不再计入）</span>
            </div>
            <div class="card-body p-0">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th>标题</th>
                            <th>作者</th>
                            <th>详情查看</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc, stat : ${hotDocs}">
                            <td th:text="${stat.count}">1</td>
                            <td><a th:href="@{/docs/{id}(id=${doc.id})}" th:text="${doc.title}">-</a></td>
                            <td th:text="${doc.authorName}">-</td>
                            <td th:text="${doc.callCount}">0</td>
                            <td>
                                <span th:if="${doc.status == 'ACTIVE'}" class="badge badge-active">正常</span>
                                <span th:if="${doc.status == 'BROKEN'}" class="badge badge-broken">有问题</span>
                                <span th:if="${doc.status == 'DEPRECATED'}" class="badge badge-deprecated">已废弃</span>
                                <span th:if="${doc.status == 'PENDING_DELETE'}" class="badge badge-broken">待删</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/jquery/jquery.min.js}"></script>
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/lib/chartjs/chart.umd.min.js}"></script>
    <script>
        $(function() {
            // 使用后端注入的 contextPath，避免 pathname 推断 / 硬编码 /exphub
            var ctx = /*[[${contextPath}]]*/ '/exphub';

            $.get(ctx + '/api/stats/call-trend', { days: 7 }, function(res) {
                if (res.code !== 0 || !res.data) return;
                var data = res.data;
                var labels = data.map(function(d) { return d.date; });
                var searches = data.map(function(d) { return d.searchCalls; });
                var creates = data.map(function(d) { return d.createCalls; });
                var updates = data.map(function(d) { return d.updateCalls; });
                var tools = data.map(function(d) { return d.toolCalls; });

                var ctx2d = document.getElementById('trendChart').getContext('2d');
                new Chart(ctx2d, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '搜索',
                                data: searches,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102,126,234,0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: '创建',
                                data: creates,
                                borderColor: '#11998e',
                                backgroundColor: 'rgba(17,153,142,0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: '更新',
                                data: updates,
                                borderColor: '#e94560',
                                backgroundColor: 'rgba(233,69,96,0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: '工具埋点',
                                data: tools,
                                borderColor: '#f093fb',
                                backgroundColor: 'rgba(240,147,251,0.1)',
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                }
                            }
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>

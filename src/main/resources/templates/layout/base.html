<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- ============================================================================
     PC 后台标准页面骨架（2026-11-17 第一批改造）

     以前它是孤儿：没人 include，自己却又抄了一份 75 行的外壳样式。现在样式全部
     归 admin.css，head 归 fragments/head，这里只留结构，作为「新页面照这个写」
     的唯一模板。

     用法（子页面整页替换，正文作为 fragment 传进来）：

         <!DOCTYPE html>
         <html xmlns:th="http://www.thymeleaf.org"
               th:replace="~{layout/base :: page('仪表盘 - 经验阁 ExpHub', ~{::main})}">
         <body>
         <main th:fragment="main">
             ...页面正文...
         </main>
         </body>
         </html>

     已有 16 个页面还没切过来（它们是各自写全的 <head> + <body>，等价但不复用），
     第二批重排版式时一并收编。
     ============================================================================ -->
<head th:fragment="page(pageTitle, body)">
    <th:block th:replace="~{fragments/head :: head(${pageTitle})}"/>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: nav('dashboard')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h4 class="mb-0" th:text="${pageTitle}">页面标题</h4>
            <div>
                <span class="text-muted mr-3" th:text="${session.user?.displayName} ?: '管理员'">管理员</span>
                <i class="fas fa-user-circle fa-lg text-muted"></i>
            </div>
        </div>

        <th:block th:replace="${body}"/>
    </div>

    <script th:src="@{/lib/jquery/jquery.min.js}"></script>
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>

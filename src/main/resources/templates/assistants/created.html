<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('创建成功 - 经验阁 ExpHub')}"/>
    <style>
    .api-key-box { background: var(--surface-2); border-radius: 8px; padding: 15px; font-family: monospace; word-break: break-all; }
    .success-icon { font-size: 4rem; color: #28a745; }
    .warning-box { background: var(--warn-bg); border: 1px solid #ffc107; border-radius: 8px; padding: 15px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: nav('assistants')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h4 class="mb-0">创建成功</h4>
            <div>
                <a th:href="@{/assistants}" class="btn btn-outline-secondary btn-sm mr-2">
                    <i class="fas fa-list mr-1"></i> 返回列表
                </a>
                <a th:href="@{/assistants/add}" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus mr-1"></i> 继续创建
                </a>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle success-icon"></i>
                </div>
                <h4 class="mb-3">助手创建成功！</h4>
                <p class="text-muted mb-4">API Key 已生成，请妥善保存，之后无法找回</p>

                <div class="text-left">
                    <div class="api-key-box mb-3">
                        <label class="text-muted mb-1" style="font-size: 0.85rem;">API Key</label>
                        <div class="font-weight-bold text-dark" id="apiKeyDisplay" th:text="${apiKey}"></div>
                    </div>
                    <div class="api-key-box">
                        <label class="text-muted mb-1" style="font-size: 0.85rem;">Secret</label>
                        <div class="font-weight-bold text-dark" id="apiKeySecretDisplay" th:text="${apiKeySecret}"></div>
                    </div>
                </div>

                <div class="warning-box mt-4 text-left">
                    <i class="fas fa-exclamation-triangle text-warning mr-2"></i>
                    <strong>重要提示：</strong>请立即复制保存以上 API Key 和 Secret，它们不会再次显示。如需重置，请到助手列表中操作。
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('秘钥管理 - 经验阁 ExpHub')}"/></head>
<body>
    <div th:replace="~{fragments/sidebar :: nav('assistants')}"></div>

    <div class="main-content">
        <div class="topbar page-head">
            <div class="page-title-wrap">
                <h4 class="page-title"><i class="fas fa-key"></i>秘钥管理</h4>
                <div class="page-sub">共 <span th:text="${#lists.size(assistants)}">0</span> 个秘钥 · 每个秘钥决定一个助手能调哪些工具</div>
            </div>
            <div class="page-actions">
                <a th:href="@{/assistants/add}" class="btn btn-primary">
                    <i class="fas fa-plus mr-1"></i> 新建秘钥
                </a>
            </div>
        </div>

        <div class="toolbar">
                <div class="d-flex align-items-center text-muted" style="font-size: 0.85rem;">
                    <i class="fas fa-info-circle mr-2"></i>
                    <span><strong>权限说明：</strong>
                        <span class="permission-tag permission-search">查询</span> 可搜索经验文档（默认开启），
                        <span class="permission-tag permission-create">创建</span> 可新建经验文档，
                        <span class="permission-tag permission-update">编辑</span> 可编辑/更新经验文档
                    </span>
                </div>
        </div>

        <div th:each="a : ${assistants}" class="assistant-card" th:data-id="${a.id}" th:data-enabled="${a.enabled}">
            <div class="d-flex align-items-center">
                <div class="assistant-avatar mr-3" th:text="${#strings.substring(a.assistantName, 0, 1)}">助</div>
                <div class="assistant-info">
                    <div class="name">
                        <span th:text="${a.assistantName}">-</span>
                        <span class="badge badge-enabled ml-2" th:if="${a.enabled}">启用中</span>
                        <span class="badge badge-disabled ml-2" th:if="${!a.enabled}">已禁用</span>
                    </div>
                    <div class="desc" th:text="${a.description}">-</div>
                    <div class="api-key">
                        <i class="fas fa-key mr-1"></i>API Key: <span th:text="${a.apiKey}">-</span>
                    </div>
                    <div class="mt-2">
                        <span class="permission-tag permission-search" th:if="${a.canSearch}">查询</span>
                        <span class="permission-tag permission-off" th:if="${!a.canSearch}">查询</span>
                        <span class="permission-tag permission-create" th:if="${a.canCreate}">创建</span>
                        <span class="permission-tag permission-off" th:if="${!a.canCreate}">创建</span>
                        <span class="permission-tag permission-update" th:if="${a.canUpdate}">编辑</span>
                        <span class="permission-tag permission-off" th:if="${!a.canUpdate}">编辑</span>
                    </div>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <div class="assistant-stats mr-4">
                    <div class="stat">
                        <div class="num" th:text="${a.totalCalls}">0</div>
                        <div class="lbl">总调用</div>
                    </div>
                    <div class="stat">
                        <div class="num text-success" th:text="${a.successCalls}">0</div>
                        <div class="lbl">成功</div>
                    </div>
                    <div class="stat">
                        <div class="num text-danger" th:text="${a.failCalls}">0</div>
                        <div class="lbl">失败</div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-outline-secondary" th:onclick="'toggleEnabled(' + ${a.id} + ')'">
                        <i class="fas fa-toggle-on" th:if="${a.enabled}"></i>
                        <i class="fas fa-toggle-off" th:unless="${a.enabled}"></i>
                        <span th:text="${a.enabled} ? '禁用' : '启用'">切换</span>
                    </button>
                    <button class="btn btn-sm btn-outline-primary" th:onclick="'editPermissions(' + ${a.id} + ')'">
                        <i class="fas fa-shield-alt"></i> 权限
                    </button>
                    <button class="btn btn-sm btn-outline-danger" th:onclick="'deleteAssistant(' + ${a.id} + ')'">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(assistants)}" class="card empty-state">
            <i class="fas fa-key"></i>
            <p>暂无秘钥，<a th:href="@{/assistants/add}">创建一个</a>吧~</p>
        </div>

        <!-- 分页 -->
        <div th:if="${totalPages > 1}" class="card list-card-foot mt-3">
            <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/assistants(page=${currentPage - 1})}">&laquo; 上一页</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/assistants(page=${i})}" th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/assistants(page=${currentPage + 1})}">下一页 &raquo;</a>
                </li>
            </ul>
            </nav>
        </div>
    </div>

    <!-- 权限编辑弹窗 -->
    <div class="modal fade" id="permissionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-shield-alt mr-2"></i>编辑秘钥权限</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editAssistantId">
                    <p class="text-muted mb-3">当前助手：<strong id="editAssistantName"></strong></p>
                    <div class="form-group">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="permSearch">
                            <label class="custom-control-label" for="permSearch">查询权限</label>
                        </div>
                        <small class="text-muted">允许通过API搜索经验文档</small>
                    </div>
                    <div class="form-group">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="permCreate">
                            <label class="custom-control-label" for="permCreate">创建权限</label>
                        </div>
                        <small class="text-muted">允许通过API创建新经验</small>
                    </div>
                    <div class="form-group mb-0">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="permUpdate">
                            <label class="custom-control-label" for="permUpdate">编辑权限</label>
                        </div>
                        <small class="text-muted">允许通过API编辑/更新经验</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="savePermissions()">
                        <i class="fas fa-save mr-1"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/jquery/jquery.min.js}"></script>
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:inline="javascript">
        var contextPath = /*[[${contextPath}]]*/ '';
        var assistants = /*[[${assistants}]]*/ [];

        async function toggleEnabled(id) {
            if (!confirm('确定要切换启用状态吗？')) return;
            try {
                var resp = await fetch(contextPath + '/api/assistants/' + id + '/toggle', {
                    method: 'POST'
                });
                var result = await resp.json();
                if (result.code === 0) {
                    location.reload();
                } else {
                    alert('操作失败：' + result.message);
                }
            } catch (e) { alert('操作失败：' + e.message); }
        }

        async function deleteAssistant(id) {
            if (!confirm('确定要删除这个秘钥吗？此操作不可恢复！')) return;
            try {
                var resp = await fetch(contextPath + '/api/assistants/' + id, {
                    method: 'DELETE'
                });
                var result = await resp.json();
                if (result.code === 0) {
                    location.reload();
                } else {
                    alert('删除失败：' + result.message);
                }
            } catch (e) { alert('删除失败：' + e.message); }
        }

        function editPermissions(id) {
            var assistant = assistants.find(function(a) { return a.id === id; });
            if (!assistant) return;
            
            document.getElementById('editAssistantId').value = id;
            document.getElementById('editAssistantName').textContent = assistant.assistantName;
            document.getElementById('permSearch').checked = assistant.canSearch === true;
            document.getElementById('permCreate').checked = assistant.canCreate === true;
            document.getElementById('permUpdate').checked = assistant.canUpdate === true;
            
            $('#permissionModal').modal('show');
        }

        async function savePermissions() {
            var id = document.getElementById('editAssistantId').value;
            var data = {
                canSearch: document.getElementById('permSearch').checked,
                canCreate: document.getElementById('permCreate').checked,
                canUpdate: document.getElementById('permUpdate').checked
            };
            
            try {
                var resp = await fetch(contextPath + '/api/assistants/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                var result = await resp.json();
                if (result.code === 0) {
                    $('#permissionModal').modal('hide');
                    location.reload();
                } else {
                    alert('保存失败：' + result.message);
                }
            } catch (e) { alert('保存失败：' + e.message); }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- CSRF token：供 static/js/csrf.js 全局注入 fetch / ajax 请求头 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 经验阁 ExpHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%23ffffff' font-family='system-ui,sans-serif' font-weight='bold'>E</text></svg>" type="image/svg+xml">
    <!-- 主题必须在 CSS 之前定下来，否则夜间打开会先白闪一帧（与 fragments/head 同一份规则） -->
    <th:block th:replace="~{fragments/theme :: init}"/>
    <link rel="stylesheet" th:href="@{/lib/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/pc.css}">
    <style>
    /* 登录页是全站门面，只有这一页需要垂直居中 —— 其余用 pc.css 的常规布局 */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: radial-gradient(1200px 600px at 50% -10%, var(--login-glow) 0%, var(--bg) 55%);
    }

    .login-card {
        width: 100%;
        max-width: 380px;
        padding: 34px 32px 30px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 10px 40px rgba(16, 24, 40, 0.07);
    }

    .login-card .brand {
        margin-bottom: 26px;
        text-align: center;
    }

    /* 品牌方块：和后台上岗栏、站点图标同一个图形，不另画一套 */
    .login-card .brand .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin-bottom: 14px;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
    }

    .login-card .brand h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: var(--text);
    }

    .login-card .brand h1 span { color: var(--brand); }

    .login-card .brand p {
        margin: 5px 0 0;
        color: var(--text-faint);
        font-size: 12.5px;
    }

    .login-card .form-control {
        height: 42px;
        font-size: 14px;
    }

    .btn-login {
        width: 100%;
        height: 42px;
        margin-top: 4px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--brand);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
    }

    .btn-login:hover {
        background: var(--brand-hover);
        color: #fff;
    }

    .login-tip {
        margin: 18px 0 0;
        color: var(--text-faint);
        font-size: 11.5px;
        text-align: center;
    }
    </style>
    <script th:src="@{/js/csrf.js}"></script>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="mark">E</div>
            <h1>经验<span>阁</span></h1>
            <p>ExpHub · 多 AI 助手协作平台</p>
        </div>

        <div th:if="${param.locked}" class="alert alert-danger mb-3">
            登录失败次数过多，账号已锁定
            <strong th:text="${param.locked[0]}">15</strong> 分钟，请稍后再试
        </div>
        <div th:if="${param.error}" class="alert alert-danger mb-3">
            用户名或密码错误<span th:if="${param.remaining}">，还剩 <strong th:text="${param.remaining[0]}">4</strong> 次机会</span>
            <span th:if="${param.remaining != null and param.remaining[0] == '1'}" class="d-block mt-1" style="font-size:12.5px;">
                再错一次将锁定 15 分钟
            </span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success mb-3">
            已成功退出登录
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group mb-3">
                <input type="text" name="username" class="form-control" placeholder="用户名" required autofocus>
            </div>
            <div class="form-group mb-3">
                <input type="password" name="password" class="form-control" placeholder="密码" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>

        <p class="login-tip">连续输错 5 次锁定 15 分钟</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('派单 - 经验阁 ExpHub')}"/>
    <style>
    table td {vertical-align: middle !important;}
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: nav('dispatch')}"></div>

    <div class="main-content">
        <div class="topbar page-head">
            <div class="page-title-wrap">
                <h4 class="page-title"><i class="fas fa-paper-plane"></i>派单</h4>
                <div class="page-sub">
                    共 <strong th:text="${orders.size()}">0</strong> 张单 ·
                    待审核 <b th:text="${counts['REVIEWING']}">0</b> ·
                    待接单 <b th:text="${counts['READY']}">0</b> ·
                    进行中 <b th:text="${counts['RUNNING']}">0</b> ·
                    待确认 <b th:text="${counts['CONFIRMING']}">0</b> ·
                    待验收 <b th:text="${counts['VERIFYING']}">0</b>
                </div>
            </div>
            <div class="page-actions">
                <a th:href="@{/dispatch/new}" class="btn btn-primary"><i class="fas fa-plus mr-1"></i>新建派单</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- 状态筛选：原来 7 个按钮全塞在页头右侧，窄屏会被挤到换行，且和「新建」抢位置 -->
        <div class="toolbar">
            <a th:href="@{/dispatch}" class="btn btn-outline-secondary"
               th:classappend="${status == null or status == ''} ? 'active'">全部</a>
            <a th:href="@{/dispatch(status='REVIEWING')}" class="btn btn-outline-warning"
               th:classappend="${status == 'REVIEWING'} ? 'active'">待审核</a>
            <a th:href="@{/dispatch(status='READY')}" class="btn btn-outline-info"
               th:classappend="${status == 'READY'} ? 'active'">待接单</a>
            <a th:href="@{/dispatch(status='RUNNING')}" class="btn btn-outline-success"
               th:classappend="${status == 'RUNNING'} ? 'active'">进行中</a>
            <a th:href="@{/dispatch(status='CONFIRMING')}" class="btn btn-outline-danger"
               th:classappend="${status == 'CONFIRMING'} ? 'active'">待确认</a>
            <a th:href="@{/dispatch(status='VERIFYING')}" class="btn btn-outline-primary"
               th:classappend="${status == 'VERIFYING'} ? 'active'">待验收</a>
        </div>

        <div class="card list-card">
            <div class="card-body p-0">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th style="width:190px">单号</th>
                            <th>标题</th>
                            <th style="width:90px">状态</th>
                            <th style="width:70px">来源</th>
                            <th style="width:90px">指派</th>
                            <th style="width:90px">接单</th>
                            <th style="width:70px">优先级</th>
                            <th style="width:150px">更新时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${orders}">
                            <td><a th:href="@{'/dispatch/' + ${o.orderNo}}" th:text="${o.orderNo}" style="font-family:monospace"></a></td>
                            <td th:text="${o.title}"></td>
                            <td><span class="st" th:classappend="'st-' + ${o.status}" th:text="${labels[o.status]}"></span></td>
                            <td>
                                <span th:if="${o.origin == 'HUMAN'}" class="text-primary">人工</span>
                                <span th:if="${o.origin == 'AI'}" class="text-secondary">AI</span>
                            </td>
                            <td th:text="${o.assignee}"></td>
                            <td th:text="${o.accepter != null ? o.accepter : '—'}"></td>
                            <td th:text="${o.priority}"></td>
                            <td class="cell-mute" th:text="${o.updatedAt != null ? #temporals.format(o.updatedAt, 'MM-dd HH:mm') : ''}"></td>
                        </tr>
                        <tr th:if="${orders.isEmpty()}">
                            <td colspan="8" class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>还没有任何单</p>
                                <p class="empty-hint">AI 通过 dispatch_create 建单后会出现在这里，等你审核。</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3 page-sub">
            ⚠️ 审核、验收、取消都只能在这里做，MCP 工具里没有这些动作 —— 闸门必须在人手里。
        </div>
    </div>
</body>
</html>

server:
  port: 3099
  servlet:
    context-path: /exphub
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 5MB
    connection-timeout: 120000

spring:
  application:
    name: ExpHub

  # MCP 走独立 WebFlux(Netty:3098)，需排除自动配置以便手动搭建该服务器。
  # ⚠️ 不可改回 WebMvc(Servlet)：Servlet 版 SSE 长连接会占满 Tomcat 线程池
  #    导致应用假死（2026-09-27 实际故障），详见 McpReactiveServerConfig 注释。
  autoconfigure:
    exclude:
      - org.springframework.ai.mcp.server.autoconfigure.McpWebFluxServerAutoConfiguration

  datasource:
    url: ${EXPHUB_DB_URL:jdbc:mysql://localhost:3306/exphub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${EXPHUB_DB_USERNAME:root}
    password: ${EXPHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    servlet:
      content-type: text/html

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  ai:
    mcp:
      server:
        name: exphub
        # 与 health / 无状态端点同源，别再各写一份数字
        version: ${exphub.version:2.2.1}
        stdio: false

# MCP SSE 心跳间隔（秒）。
# MCP 的 SSE 长连接在两次工具调用之间会长时间静默，静默连接会被 Nginx
# (keepalive_timeout 65s) 以及运营商 / NAT / 防火墙按各自的空闲超时掐断，
# 客户端只能不断重连（2026-10-09 实测：11 天 3877 次新建连接、日均 350+ 次，
# 用户体感为「偶尔连不上」）。服务端每 30s 发一个 SSE 注释行保活。
# ⚠️ 调整时须小于上述各层的最小空闲超时，否则心跳无效。
exphub:
  # 产品版本号（2026-11-05 起为 2.2.1）。health、SSE 的 serverInfo、无状态端点的
  # serverInfo 全部读这一处，改版本只改这里。
  # ⚠️ 这不是 pom.xml 的 Maven artifact 版本（仍是 1.0.0）：改 pom 会改 jar 文件名，
  #    而 systemd service 与 deploy.sh 里写死了 target/exphub-1.0.0.jar，一改就得
  #    同步服务器配置，否则线上服务起不来。产品版本单独放，改它零部署风险。
  version: 2.2.1
  mcp:
    sse-heartbeat-seconds: 30
    # MCP 单次请求体上限（字节）。默认 5MB；Nginx 对应 client_max_body_size 10m。
    max-request-bytes: 5242880
    # get_experience_detail / get_experience_history 单次读取上限（字符）。
    # 超过后提示用 export_document 读取完整内容。
    detail-max-chars: 20000

  # 信箱角色代号基准表 —— **单一数据源，改这里，不要改成 Java 常量**
  # （2026-11-08 阁主定：文案/名单散在代码里没人知道该改哪，上一轮就吃过这个亏）
  # mail_send 开新线程时校验收件人；实际可用代号 = 本表 ∪ 库里已出现过的 role（老角色即使这里漏写也认）
  # 新增助手：在这里加一个代号（小写英文），不用改代码。
  mail:
    known-roles: zhulong,baize,gezhu,pixiu,yazi,qilin,fenghuang,chongmingniao,jiuweihu,dijiang
    # 收件人别名 → 正名（发信时归一，历史老信的 to_role 不动）。
    # 为什么需要：known-roles 是「配置 ∪ 库里出现过的 role」，拼错但历史上真存在过的代号
    # （zhuolong，多一个 o）会被放行入库，而收件箱按 to_role 精确匹配 → 信在、没人收、全程无感。
    # 事故：#22 / #45 / #72 三封（2026-11-08 白泽查库、阁主 #76 批准归一）。
    #
    # piyao / yaci（2026-11-08 阁主 #119，越哥已批）：上一版把貔貅/睚眦写成了 piyao/yaci，
    # 而忆阁闸门与桥头身份用的是正名 pixiu/yazi → 两边名单对不上，yazi 被 ExpHub 拒、
    # 貔貅也收不到新信。正名已改回；这两个拼写同时进别名表，历史行（#110 的 to_role=piyao）
    # 不改数据，靠收件箱按别名并查归到正主。
    role-aliases: zhuolong=zhulong,zhulogn=zhulong,zhulon=zhulong,beize=baize,gezu=gezhu,piyao=pixiu,yaci=yazi

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 日志级别（2026-10-24 收敛）
# ⚠️ 不要把 com.exphub.mapper 开到 DEBUG：MyBatis 会把 SQL 参数全量打进日志，
#    其中包含 ai_assistants.api_key 的完整值（实测 6 分钟内出现 169 次）。
#    日志一旦外发排障 = 泄露 Key，拿到即可读写全部经验。
# ⚠️ io.modelcontextprotocol 开 DEBUG 会打印完整 JSON-RPC 请求体（含经验正文），
#    同时日志量约 130MB/天。需要排障时用环境变量临时开，不要写死在配置里。
logging:
  level:
    root: INFO
    com.exphub: ${EXPHUB_LOG_LEVEL:INFO}
    com.exphub.mapper: ${EXPHUB_LOG_MAPPER:INFO}
    io.modelcontextprotocol: ${EXPHUB_LOG_MCP:WARN}
    org.springframework.security: WARN

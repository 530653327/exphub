server:
  port: 3099
  servlet:
    context-path: /exphub
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 5MB
    connection-timeout: 120000

spring:
  application:
    name: ExpHub

  # MCP 走独立 WebFlux(Netty:3098)，需排除自动配置以便手动搭建该服务器。
  # ⚠️ 不可改回 WebMvc(Servlet)：Servlet 版 SSE 长连接会占满 Tomcat 线程池
  #    导致应用假死（2026-09-27 实际故障），详见 McpReactiveServerConfig 注释。
  autoconfigure:
    exclude:
      - org.springframework.ai.mcp.server.autoconfigure.McpWebFluxServerAutoConfiguration

  datasource:
    url: ${EXPHUB_DB_URL:jdbc:mysql://localhost:3306/exphub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${EXPHUB_DB_USERNAME:root}
    password: ${EXPHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    servlet:
      content-type: text/html

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  ai:
    mcp:
      server:
        name: exphub
        # 与 health / 无状态端点同源，别再各写一份数字
        version: ${exphub.version:2.5.6}
        stdio: false

# MCP SSE 心跳间隔（秒）。
# MCP 的 SSE 长连接在两次工具调用之间会长时间静默，静默连接会被 Nginx
# (keepalive_timeout 65s) 以及运营商 / NAT / 防火墙按各自的空闲超时掐断，
# 客户端只能不断重连（2026-10-09 实测：11 天 3877 次新建连接、日均 350+ 次，
# 用户体感为「偶尔连不上」）。服务端每 30s 发一个 SSE 注释行保活。
# ⚠️ 调整时须小于上述各层的最小空闲超时，否则心跳无效。
exphub:
  # 产品版本号（2026-11-15 起为 2.5.6；2.5.5 是 11-14 的信箱代发版）。health、SSE 的 serverInfo、无状态端点的
  # serverInfo 全部读这一处，改版本只改这里。
  # 2.5.4 = mail_send 幂等回执补两个机读字段 + 新增按幂等键查消息（阁主 T261114084728-182）：
  #         回执固定印「本次新建: 是/否（created/replayed）」与「clientMsgId: <入库值>」，真发与回放两边对称；
  #         mail_thread 加 clientMsgId 参数（与 threadId 二选一），按 uk_mail_client 查该键对应的消息，
  #         只读、不推游标；查不到明说「没落库、下次会新建」。幂等键查库前统一 trim，与入库口径一致。
  # 2.5.3 = mail_send 幂等命中可区分（阁主 T261114082605-521）：同 clientMsgId 二次发送不新建消息，
  #         回执首句改为「⚠️ 幂等命中：本次没有新建消息」并报原消息 id/线程/原时间；本次请求与库里那封
  #         内容/收件人/线程不一致时逐项点出并劝换新键；发件人不同（键被别的角色占用）直接明拒。
  #         日志同步加「（本次未新建）」标记。此前回放与真发一封的回执逐字相同，忆阁据此把单推进到 running。
  # 2.4.0 = 信箱角色清单迁库（A+B 合并 + 正名改汉字）：校验改读 mail_roles（status='ACTIVE'），
  #         **正名是汉字（烛龙/重明鸟…），拼音降为别名**（兼容期入参两种都收，出口一律汉字）；
  #         删 application.yml 的 known-roles / role-aliases，回信收件人强制取父消息发件人。
  # 2.5.2 = 相似度入队门槛（阁主 #834 / T261111085841-439）：正文 0 行重合（行口径）不入队，
  #         minSharedLines 默认 1、传 0 回退旧行为；回退 2-gram 的文档不受该门约束；
  #         已判过（非 PENDING）的对不再进候选展示，只在回执里计数。
  # 2.5.1 = 信箱回执排版修（阁主 #634）：含已读 / 只读摘要两条分支的续写不再另起一行，
  #         分号不许顶到行首（「…；未读 N 封；含已读｜你传的 limit=N」读成一句）；
  #         默认分支一字未动，末行 JSON 与 limit 回显位置、值都不变。
  # 2.5.0 = 信箱「全部来信 + 时间倒序 + 真分页」（阁主 #625）：mail_start 加 includeRead / lastId /
  #         beforeId 三个可选参数；每条线程带稳定排序键 latestId；窗口边界显式返回，不许把
  #         「扫到 200 条窗口」显示成「没有更早的信」；不传三参数时默认分支逐字不变、不推游标。
  # ⚠️ 这不是 pom.xml 的 Maven artifact 版本（仍是 1.0.0）：改 pom 会改 jar 文件名，
  #    而 systemd service 与 deploy.sh 里写死了 target/exphub-1.0.0.jar，一改就得
  #    同步服务器配置，否则线上服务起不来。产品版本单独放，改它零部署风险。
  # 2.5.5 = 信箱代发（阁主 W-20261114-09）：mail_send 加 onBehalfOf（按声明角色判定 ——
  #         声明角色须为阁主，才能以「越哥」的名义发；角色头是自报的，这是配置归属检查不是鉴权，
  #         挡不住改 http 头的人）；真实 from_role 仍是阁主，所以回信路由与历史信不变；新增列 mail_messages.on_behalf_of
  #         （NULL=不是代发）；收件侧显示「越哥（经阁主代发）」，JSON 增加 fromRole/onBehalfOf；
  #         幂等命中时 onBehalfOf 不同直接明拒。⚠️ 鉴权口径未变：仍是共享 Key + 自报角色头，
  #         这是委托信任、不是「只有忆阁」的密码学证明（#1540）；真隔离需每角色独立 Key。
  # 2.5.6 = 工具统计排除 mail_start 哨兵轮询（阁主 W-20261115-17）：call_logs 加 is_poll
  #         （1=unreadOnly 轮询 / 0=真实调用 / NULL=迁移前历史行不回填）；所有工具维度聚合
  #         统一拼 ToolPollPolicy.EXCLUDE_POLL_SQL；/tool-stats 与 get_tool_stats 共用同一句
  #         「已排除 mail_start 调用 N 次、真实读信 M 次仍计入」；仪表盘 totalTool/todayTool 同步排除。
  # 2.5.7 = 派单进「待验收」时发邮件提醒（2026-11-19，抄忆阁 3.3.96 的作业）：submitAccept 提交成功后
  #         在 AFTER_COMMIT 发一封邮件（单号/标题/指派/结论/内容/后台直达链接）；独立单线程发送队列、
  #         失败重试 2 次、同一轮去重 10 分钟、每小时 20 封/每天 100 封（超限累计进下一封）；
  #         缺 EXPHUB_MAIL_HOST/USER/PASS/TO 任一项 = 未配置：启动不报错、发信跳过，派单主流程照跑。
  #         ⚠️ 不配 spring.mail.*（避免自动配置建 bean 的启动依赖），凭证只写 /etc/exphub/.env，日志零回显。
  # 2.5.8 = dispatch_list 不再写调用埋点（越哥 2026-11-19）：它 7 天被调 4.5 万次，占「排除历史信箱轮询后」
  #         全部工具调用的 82%，其它工具在榜上只剩 1% 以下，成功率/占比/趋势的对比全部失去意义。
  #         新调用在切面层就不写 call_logs（不是写了再排除）；历史行由 ToolPollPolicy.EXCLUDE_POLL_SQL
  #         排除，回执写明「窗口内历史埋点 N 次，会随时间降到 0」；它也不进「从未被调用」清单。
  #         开关：exphub.tool-stats.skip-telemetry（空串 = 恢复该工具的埋点）。
  # 2.5.9 = 派单列表「分页看不见」修（2026-11-19 越哥：还是没有分页呀）：翻页控件原来整块挂在
  #         th:if="${totalPages > 1}" 下，而库里只有 19 张单、PC 每页 20 张 —— 功能在、界面上什么都没有。
  #         现在两个端都**始终显示**翻页条（含「1 / 1」「第 1–19 张 / 共 19 张」）并新增「每页 10/20/50 张」
  #         选择器（?size=，白名单外回落默认），数据不足一页也能当场验证翻页；翻页链接带 size/status/keyword。
  # 2.5.10 = 同一件事的「能验证」收口：翻页条抽成唯一实现 fragments/dispatch-pager.html（两个端共用），
  #          并加真渲染守卫 DispatchPagerRenderTest —— 原来的断言只检查「源码里有没有这段字」，
  #          被 th:if 藏起来、或 th:text 里把 ${} 和字面量混拼导致解析失败，字符串断言都是绿的。
  # 2.5.11 = 后台人工建单也要带 api_key（2026-11-19 修「人工单哨兵看不见」）：原来固定写 ''，
  #          而 MCP 查单按 Key 隔离，哨兵一条都查不到（W-20261119-000001 挂在 READY 没人接）。
  #          现在 origin=HUMAN 且未显式给 Key 时，自动归属「派单共享 Key」（最近一张 AI 单用的那把）；
  #          建单回执与两端建单页都写明归属 Key 尾号，取不到共享 Key 时保持空串并明确警告，不许静默。
  # 2.5.12 = 后台白天/夜间双模式（W-20261119-000001）：按本地时间自动切（06:00–18:00 白天，其余夜间），
  #          PC 侧栏底部可手动固定（自动 → 白天 → 夜间），移动端「我的 → 外观」三档（自动/深/浅）；
  #          首帧防闪脚本在 fragments/theme.html，运行时规则在 js/theme.js（边界 6/18 两处一致）；
  #          pc.css 补夜间变量层（色板与移动端 exp 主题同值）+ 顺手修掉 :root 少一个 } 的既有缺陷
  #          （浏览器 CSS Nesting 容错把整份规则当嵌套，html[data-theme] 永远不匹配）。
  # 2.5.13 = 派单发版版本号取号改基准（W-20261119-000008）：原来「同项目最近一张带版本的单」
  #          按 id 取，而历史单号段本身可能是错的 —— 忆阁单落成 1.0.3、线上实际 3.4.x。
  #          现在基准 = 项目当前版本（projects.current_version）与项目历史单里**数值最大**者取大，
  #          版本比较按数字段（1.0.10 > 1.0.9）；算不出基准就明拒，不再静默给 1.0.0。
  #          推算依据落库（dispatch_header.version_basis），建单回执 / 待审核页都显示；
  #          发版单验收通过时把版本自动回写项目当前版本（只升不降）。
  # 2.5.14 = 派单角色别名补 yinglong→应龙（W-20261119-000010 / #3539）：应龙上岗时漏了
  #          ROLE_ALIASES 与 ASSIGNABLE_ROLES 两处，dispatch_list 按 code 查单永远落空、
  #          W-20261119-000007 卡在待接单零 item。补映射 + 后台下拉；新增
  #          DispatchRoleAliasTest 守住「可指派角色必须都有别名」。
  version: 2.5.14
  # 工具统计口径（2026-11-19 加）
  tool-stats:
    # 不写逐次埋点的工具（逗号分隔）。改这里就同时影响「是否写 call_logs」与「零调用清单」，
    # 不需要改代码；置空 = 恢复埋点。加工具名之前先问一句：它的**每一次**调用都不携带判断价值吗？
    skip-telemetry: ${EXPHUB_TOOL_SKIP_TELEMETRY:dispatch_list}
  mcp:
    # 2026-11-17 停用 SSE。越哥：「那个没有重连功能，用起来不方便」。
    # 背景：SSE 有会话概念，服务一重启会话就失效（sse_session_not_found），
    #      WorkBuddy 等客户端不会自动重连，表现就是「偶尔连不上、要手动重开」。
    # 实测（2026-11-17）：公网 /mcp/sse 当日仅 32 次请求，全部来自 20+ 个腾讯云 IP
    #      各 1~2 次 = 扫描器探测；真实业务流量 ~4 万次全部走 /mcp/http（2 个固定 IP）。
    # 回滚方式：本项改 true + 恢复 nginx 的 `location /exphub/mcp/ { proxy_pass :3098; }`。
    sse-enabled: false
    sse-heartbeat-seconds: 30
    # MCP 单次请求体上限（字节）。默认 5MB；Nginx 对应 client_max_body_size 10m。
    max-request-bytes: 5242880
    # get_experience_detail / get_experience_history 单次读取上限（字符）。
    # 超过后提示用 export_document 读取完整内容。
    detail-max-chars: 20000

  # 邮件提醒（2026-11-19 加）：派单提交验收（进「待验收」）时给越哥发一封邮件。
  # ⚠️ 这里只有占位符，真值写在服务器 /etc/exphub/.env（systemd EnvironmentFile）。
  # ⚠️ 缺 host/user/pass/to 任一项 = 未配置：**启动不报错**，发信时跳过并打一条节流日志，
  #    派单主流程照跑（fail-soft，抄忆阁 3.3.96 的口径）。
  # ⚠️ 不要在这里写明文授权码，也不要把它贴进任何经验/日志/接口响应。
  mail:
    enabled: ${EXPHUB_MAIL_ENABLED:true}
    host: ${EXPHUB_MAIL_HOST:}
    # 465 = 隐式 SSL；其它端口（常见 587）自动走 STARTTLS
    port: ${EXPHUB_MAIL_PORT:465}
    user: ${EXPHUB_MAIL_USER:}
    pass: ${EXPHUB_MAIL_PASS:}
    to: ${EXPHUB_MAIL_TO:}
    from-name: ${EXPHUB_MAIL_FROM_NAME:经验阁 ExpHub}
    # 邮件里「去后台处理」的链接前缀（不带末尾斜杠）
    base-url: ${EXPHUB_MAIL_BASE_URL:https://cloudim.club/exphub}
    # 同一事件（同一轮 item）10 分钟内只发一封；每小时 20 封、每天 100 封，超限累计进下一封
    dedup-minutes: ${EXPHUB_MAIL_DEDUP_MINUTES:10}
    hour-limit: ${EXPHUB_MAIL_HOUR_LIMIT:20}
    day-limit: ${EXPHUB_MAIL_DAY_LIMIT:100}
    connect-timeout-ms: ${EXPHUB_MAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${EXPHUB_MAIL_READ_TIMEOUT_MS:10000}
    # 失败重试 2 次（5s、15s），仍失败只记 WARN，不抛给调用方
    retry-delays-ms: "${EXPHUB_MAIL_RETRY_DELAYS_MS:5000,15000}"


mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 日志级别（2026-10-24 收敛）
# ⚠️ 不要把 com.exphub.mapper 开到 DEBUG：MyBatis 会把 SQL 参数全量打进日志，
#    其中包含 ai_assistants.api_key 的完整值（实测 6 分钟内出现 169 次）。
#    日志一旦外发排障 = 泄露 Key，拿到即可读写全部经验。
# ⚠️ io.modelcontextprotocol 开 DEBUG 会打印完整 JSON-RPC 请求体（含经验正文），
#    同时日志量约 130MB/天。需要排障时用环境变量临时开，不要写死在配置里。
logging:
  level:
    root: INFO
    com.exphub: ${EXPHUB_LOG_LEVEL:INFO}
    com.exphub.mapper: ${EXPHUB_LOG_MAPPER:INFO}
    io.modelcontextprotocol: ${EXPHUB_LOG_MCP:WARN}
    org.springframework.security: WARN

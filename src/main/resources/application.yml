server:
  port: 3099
  servlet:
    context-path: /exphub
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 5MB
    connection-timeout: 120000

spring:
  application:
    name: ExpHub

  # 说明：MCP 已从 WebFlux(Netty:3098) 切换为 WebMvc(Servlet:3099)，
  # 目的：让「鉴权拦截器」与「工具执行」处于同一 Tomcat 线程，
  # 使 ThreadLocal 身份传递可靠（原 WebFlux 下工具在别的线程执行，
  # 导致身份为 null 或读到其它请求的残留值，隔离失效）。

  datasource:
    url: ${EXPHUB_DB_URL:jdbc:mysql://localhost:3306/exphub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${EXPHUB_DB_USERNAME:root}
    password: ${EXPHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    servlet:
      content-type: text/html

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  ai:
    mcp:
      server:
        name: exphub
        version: 1.0.0
        stdio: false
        # 保持与原 WebFlux 版一致的对外路径（Nginx /exphub/mcp/ 前缀 + context-path /exphub）
        sse-endpoint: /mcp/sse

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.security: DEBUG
    com.exphub: DEBUG
    io.modelcontextprotocol: DEBUG

server:
  port: 3099
  servlet:
    context-path: /exphub
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 5MB
    connection-timeout: 120000

spring:
  application:
    name: ExpHub

  # MCP 走独立 WebFlux(Netty:3098)，需排除自动配置以便手动搭建该服务器。
  # ⚠️ 不可改回 WebMvc(Servlet)：Servlet 版 SSE 长连接会占满 Tomcat 线程池
  #    导致应用假死（2026-09-27 实际故障），详见 McpReactiveServerConfig 注释。
  autoconfigure:
    exclude:
      - org.springframework.ai.mcp.server.autoconfigure.McpWebFluxServerAutoConfiguration

  datasource:
    url: ${EXPHUB_DB_URL:jdbc:mysql://localhost:3306/exphub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${EXPHUB_DB_USERNAME:root}
    password: ${EXPHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    servlet:
      content-type: text/html

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  ai:
    mcp:
      server:
        name: exphub
        version: 1.0.0
        stdio: false

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.security: DEBUG
    com.exphub: DEBUG
    io.modelcontextprotocol: DEBUG
